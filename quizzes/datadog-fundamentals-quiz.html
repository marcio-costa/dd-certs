    {l:"E",q:"What is the default DogStatsD flush interval to Datadog?",
      o:["1s","5s","10s","60s"], c:2,
      e:"DogStatsD aggregates and flushes every 10 seconds by default.",
      u:"https://docs.datadoghq.com/developers/dogstatsd/"},
    /* --- MEDIUM (25) --- */
    {l:"M",q:"Which metric type sends raw values to Datadog for accurate percentile aggregation across hosts?",
      o:["Histogram","Distribution","Gauge","Count"], c:1,
      e:"DISTRIBUTION sends raw samples (DDSketch) to Datadog so percentiles (p50/p90/p99) are accurate globally. HISTOGRAM aggregates on the Agent and cannot be merged across hosts.",
      u:"https://docs.datadoghq.com/metrics/distributions/"},
    {l:"M",q:"Which metric type is computed by the Agent as 'count / interval'?",
      o:["Gauge","Rate","Distribution","Set"], c:1,
      e:"RATE = count per second over the flush interval. Useful for per-second views, but loses precision compared to COUNT for short bursts.",
      u:"https://docs.datadoghq.com/metrics/types/"},
    {l:"M",q:"A web service emits <code>requests:1|c|#env:prod,service:web,status:200</code>. What does this submit?",
      o:["A counter named 'requests' with 3 tags","A gauge","A log line","A trace"], c:0,
      e:"<code>|c</code> = counter. Tags after <code>|#</code> are attached. So this increments 'requests' tagged env:prod, service:web, status:200.",
      u:"https://docs.datadoghq.com/developers/dogstatsd/datagram_shell/"},
    {l:"M",q:"Why is a HISTOGRAM less accurate than a DISTRIBUTION when you have many hosts emitting the same metric?",
      o:["Histograms are aggregated per-Agent, so percentiles cannot be merged across hosts accurately","Histograms are slower","Histograms drop data","No difference"], c:0,
      e:"HISTOGRAM percentiles are computed per Agent and cannot be merged correctly (the average of medians ≠ true median). DISTRIBUTION solves this by storing the full sketch globally.",
      u:"https://docs.datadoghq.com/metrics/distributions/"},
    {l:"M",q:"Where do tags applied at the Agent host level (datadog.yaml's <code>tags:</code>) attach?",
      o:["Only to the Agent's own metrics","To every metric, log, and trace originating on that host","Only to logs","Only to events"], c:1,
      e:"Host-level tags propagate to all telemetry shipped from that Agent — metrics, logs, traces, events, and service checks.",
      u:"https://docs.datadoghq.com/getting_started/tagging/assigning_tags/"},
    {l:"M",q:"What is the Datadog API endpoint for submitting logs over HTTPS?",
      o:["https://api.datadoghq.com/api/v1/logs","https://http-intake.logs.&lt;site&gt;/v1/input/&lt;API_KEY&gt;","UDP 514","TCP 8125"], c:1,
      e:"Logs are POSTed to <code>http-intake.logs.&lt;site&gt;/v1/input/&lt;API_KEY&gt;</code> (or with a header). The Agent or direct integrations use this endpoint.",
      u:"https://docs.datadoghq.com/api/latest/logs/"},
    {l:"M",q:"A team uses inconsistent tag keys: 'env' and 'environment'. What is the practical consequence?",
      o:["Datadog auto-merges them","The two keys are independent — dashboards/monitors can't combine telemetry by environment","Both keys are dropped","One is randomly chosen"], c:1,
      e:"Tag keys are distinct. Standardize on Unified Service Tagging keys (<code>env</code>, <code>service</code>, <code>version</code>) to avoid fragmenting your data.",
      u:"https://docs.datadoghq.com/getting_started/tagging/unified_service_tagging/"},
    {l:"M",q:"Which is a valid character to BEGIN a tag string?",
      o:["A digit","A letter","An underscore","A colon"], c:1,
      e:"Tags must start with a letter (a-z, A-Z, or any unicode letter). Digits and special characters at the start are not consistently supported across products.",
      u:"https://docs.datadoghq.com/getting_started/tagging/"},
    {l:"M",q:"Which Datadog mechanism allows you to convert log events into time-series metrics?",
      o:["Log-Based Metrics (Generate Metrics)","DogStatsD","Trace Metrics","Pipeline aliasing"], c:0,
      e:"Logs → Configuration → Generate Metrics lets you derive a metric from logs matching a query, optionally grouping by tags.",
      u:"https://docs.datadoghq.com/logs/log_configuration/logs_to_metrics/"},
    {l:"M",q:"Which is true about service-check submissions?",
      o:["Service checks are metrics","Service checks are special status events (OK/WARNING/CRITICAL/UNKNOWN) submitted by integrations","Service checks are logs","Service checks are deprecated"], c:1,
      e:"Service checks (OK=0, WARNING=1, CRITICAL=2, UNKNOWN=3) report the health of an integration's target. They power Service Check monitors.",
      u:"https://docs.datadoghq.com/developers/service_checks/"},
    {l:"M",q:"Which is a recommended way to add static tags to a containerized Agent?",
      o:["Mount /etc/passwd","Set <code>DD_TAGS=\"env:prod team:billing\"</code> on the Agent container","Edit /etc/hosts","Use SSH"], c:1,
      e:"<code>DD_TAGS</code> sets host-level tags. Use spaces between tags. Whitespace is NOT auto-converted to underscores, so include spaces only between distinct tags.",
      u:"https://docs.datadoghq.com/agent/guide/environment-variables/"},
    {l:"M",q:"What does the <code>integrations:</code> docs page actually represent in the Agent context?",
      o:["A list of Datadog SaaS regions","The catalog of officially supported integrations (Agent + crawler) with setup steps","A list of monitors","Pricing tiers"], c:1,
      e:"The Integrations page is the canonical catalog. Each integration documents requirements, conf.yaml format, and the metrics it produces.",
      u:"https://docs.datadoghq.com/integrations/"},
    {l:"M",q:"True or false: high-cardinality tags can dramatically increase your custom-metric bill.",
      o:["True","False"], c:0,
      e:"Custom metric pricing is per unique combination of metric name + tags. Adding unique IDs (user_id, request_id) explodes cardinality.",
      u:"https://docs.datadoghq.com/account_management/billing/custom_metrics/"},
    {l:"M",q:"Which Python method submits a count from a custom Agent check?",
      o:["self.gauge('m', v)","self.count('m', v)","self.monotonic_count('m', v)","Both B and C are valid count submissions"], c:3,
      e:"<code>count</code> accumulates a value per interval; <code>monotonic_count</code> derives the delta from an ever-growing counter (e.g., kernel counter). Both are valid count submissions.",
      u:"https://docs.datadoghq.com/metrics/custom_metrics/agent_metrics_submission/"},
    {l:"M",q:"In the AWS crawler integration, what is the typical authentication method?",
      o:["Static AWS access keys","An IAM role assumed by Datadog from its account","Username/password","Kerberos"], c:1,
      e:"You create an IAM role in your AWS account that trusts Datadog's principal (with an external ID), and Datadog assumes it to pull CloudWatch metrics, tags, and events.",
      u:"https://docs.datadoghq.com/integrations/amazon_web_services/"},
    {l:"M",q:"Which Datadog API endpoint queries a metric for a time range?",
      o:["GET /api/v1/query","POST /api/v2/logs/search","GET /api/v1/monitor","POST /api/v1/dashboard"], c:0,
      e:"<code>GET /api/v1/query?from=&to=&query=...</code> returns time-series points for a metric query.",
      u:"https://docs.datadoghq.com/api/latest/metrics/"},
    {l:"M",q:"Which is a Datadog Agent integration that uses 'cluster checks'?",
      o:["A check that runs once per host","A check that runs once per cluster (e.g., an external HTTPS endpoint)","A check that disables itself","A monitor"], c:1,
      e:"Cluster checks are scheduled by the Cluster Agent and executed once per cluster on Cluster Check Runners, avoiding N-way duplication.",
      u:"https://docs.datadoghq.com/containers/cluster_agent/clusterchecks/"},
    {l:"M",q:"True or false: events submitted via DogStatsD include a title and a body.",
      o:["True","False"], c:0,
      e:"The DogStatsD event format is <code>_e{title.length,body.length}:title|body|tags...</code>. Both title and body are required.",
      u:"https://docs.datadoghq.com/developers/dogstatsd/datagram_shell/"},
    {l:"M",q:"Which is a 'reserved' Datadog tag key with special behavior?",
      o:["env","service","version","All of the above"], c:3,
      e:"<code>env</code>, <code>service</code>, and <code>version</code> are reserved keys that integrate across the platform via Unified Service Tagging.",
      u:"https://docs.datadoghq.com/getting_started/tagging/unified_service_tagging/"},
    {l:"M",q:"Which DogStatsD metric type would you use to count unique users in a time window?",
      o:["Count","Gauge","Set","Histogram"], c:2,
      e:"SET (|s) counts unique elements seen during the flush interval (Agent-side dedup). For cross-host dedup, use a different mechanism (e.g., a Distribution of user IDs is NOT recommended).",
      u:"https://docs.datadoghq.com/developers/dogstatsd/datagram_shell/"},
    {l:"M",q:"What is the BEST way to tag containerized workloads consistently?",
      o:["Tag at the orchestrator level (Kubernetes labels) and rely on the Agent's tag extractor","Hand-edit each Agent","Tags can't be applied to containers","Use only env vars"], c:0,
      e:"The Agent extracts Kubernetes labels/annotations into Datadog tags using the kubernetes_pod_labels_as_tags / annotations_as_tags settings, ensuring a single source of truth.",
      u:"https://docs.datadoghq.com/containers/kubernetes/tag/"},
    {l:"M",q:"Which file path holds the Agent's official integration list (e.g., for an integration check named 'redisdb')?",
      o:["/etc/datadog-agent/redis.yaml","/etc/datadog-agent/conf.d/redisdb.d/conf.yaml","/var/dd/redis.yml","/opt/datadog/redis"], c:1,
      e:"Integration configs live under <code>/etc/datadog-agent/conf.d/&lt;integration&gt;.d/conf.yaml</code>.",
      u:"https://docs.datadoghq.com/getting_started/integrations/"},
    {l:"M",q:"Which Datadog API authentication header is REQUIRED for most read endpoints?",
      o:["DD-API-KEY only","DD-APPLICATION-KEY only","Both DD-API-KEY and DD-APPLICATION-KEY","Bearer token only"], c:2,
      e:"Most read APIs require both <code>DD-API-KEY</code> (org auth) and <code>DD-APPLICATION-KEY</code> (user/service-account auth).",
      u:"https://docs.datadoghq.com/api/latest/authentication/"},
    {l:"M",q:"Which Datadog product is the canonical way to ingest custom events programmatically?",
      o:["Events API (POST /api/v1/events) or DogStatsD events","Audit log","Slack","Email"], c:0,
      e:"Events are submitted via the Events API or as DogStatsD events. They appear in the Events Explorer and can trigger event monitors.",
      u:"https://docs.datadoghq.com/api/latest/events/"},
    {l:"M",q:"True or false: tags set in datadog.yaml are merged with tags set by the orchestrator (e.g., Kubernetes labels) for telemetry from that node.",
      o:["True","False"], c:0,
      e:"Host-level tags + orchestrator-derived tags + instance tags are all merged. Avoid duplication (same key with different values).",
      u:"https://docs.datadoghq.com/getting_started/tagging/assigning_tags/"},
    /* --- HARD (10) --- */
    {l:"H",q:"You see <code>system.cpu.user</code> jumping erratically. Investigation shows the metric is reported as a GAUGE. What's the implication?",
      o:["Datadog computes the rate automatically","The value is a snapshot — gaps or instantaneous spikes are normal; consider rate() or moving avg for stable views","Restart the Agent","File a bug"], c:1,
      e:"Gauges are instantaneous and can be noisy. Use Datadog query functions (avg, moving_rollup, rate) or switch to RATE-based metrics for smoother analysis.",
      u:"https://docs.datadoghq.com/metrics/types/"},
    {l:"H",q:"A Python DogStatsD client buffers metrics. The application crashes. What happens to buffered metrics?",
      o:["Datadog auto-recovers them","They are lost — DogStatsD is fire-and-forget","Datadog replays them","They are sent to logs"], c:1,
      e:"DogStatsD has no durability. Application crashes lose buffered metrics. For critical counters, prefer Agent integrations or persistent queues.",
      u:"https://docs.datadoghq.com/developers/dogstatsd/"},
    {l:"H",q:"In a Kubernetes Deployment, which Agent setting promotes pod labels into Datadog tags?",
      o:["DD_KUBERNETES_POD_LABELS_AS_TAGS","DD_LABEL_TAGS","DD_TAGS_AS_LABELS","DD_K8S_ENABLE_LABELS"], c:0,
      e:"<code>DD_KUBERNETES_POD_LABELS_AS_TAGS</code> (or the YAML equivalent) maps pod labels to Datadog tags using a JSON dict.",
      u:"https://docs.datadoghq.com/containers/kubernetes/tag/"},
    {l:"H",q:"A team submits a high-cardinality custom metric and the bill explodes. The fastest mitigation is:",
      o:["Drop the metric and re-publish from scratch","Use 'Manage Tags' in Metric Settings to exclude high-cardinality tag values from indexing","Restart all Agents","Buy a bigger plan"], c:1,
      e:"In Metrics Summary → tag exclusion, you can stop indexing certain tags or aggregate them — reducing cardinality without dropping the metric.",
      u:"https://docs.datadoghq.com/metrics/custom_metrics/"},
    {l:"H",q:"What is the practical reason to prefer Agent-based integrations over crawler integrations when possible?",
      o:["Lower latency, higher granularity, richer per-host context, and no 5-minute CloudWatch delay","Crawlers are deprecated","Agents are free","Crawlers don't work"], c:0,
      e:"Crawlers inherit cloud-provider limits (e.g., AWS CloudWatch granularity, retrieval delay). Agent integrations collect at native granularity (often 10–15s) with full tag fidelity.",
      u:"https://docs.datadoghq.com/integrations/"},
    {l:"H",q:"Which is TRUE about metric submission frequency vs the displayed resolution?",
      o:["Datadog displays at exactly the submitted rate always","Datadog rolls up data based on the queried time window — short windows show finer granularity than long windows","Resolution is fixed at 1s","Resolution is fixed at 1h"], c:1,
      e:"Datadog automatically rolls up time-series based on the queried window. Short windows = high resolution; long windows = aggregated. Use <code>rollup()</code> explicitly to control this.",
      u:"https://docs.datadoghq.com/dashboards/querying/"},
    {l:"H",q:"Which metric query function would you use to display per-second throughput from a counter?",
      o:["sum_by","per_second()","avg","top"], c:1,
      e:"<code>.as_rate()</code> or <code>per_second()</code> converts a COUNT into a per-second rate. Available in the query language and the UI.",
      u:"https://docs.datadoghq.com/metrics/types/"},
    {l:"H",q:"True or false: log-based metrics can use the same tag keys as ingested metrics for cross-correlation.",
      o:["True","False"], c:0,
      e:"Log-based metrics use the same tag namespace. Apply env/service/version consistently so dashboards and monitors can correlate logs-derived metrics with infrastructure metrics.",
      u:"https://docs.datadoghq.com/logs/log_configuration/logs_to_metrics/"},
    {l:"H",q:"Which is the BEST practice for tagging a metric with the customer who triggered an action?",
      o:["Tag with the customer ID (high cardinality)","Tag with the customer's plan or segment (low cardinality) and store the ID in logs","Drop the metric","Use a free-form tag"], c:1,
      e:"Avoid per-record IDs in metric tags (high cardinality → high cost). Keep IDs in logs (or distributions) and tag metrics with low-cardinality dimensions.",
      u:"https://docs.datadoghq.com/metrics/custom_metrics/"},
    {l:"H",q:"You upgrade a service and want to monitor the new version side-by-side. How do you slice metrics by deployed version automatically?",
      o:["Manually create a new metric","Set DD_VERSION on the service so the version tag flows through metrics, traces, and logs","Use a different API key","Disable the old version"], c:1,
      e:"With Unified Service Tagging, <code>DD_VERSION</code> (or the orchestrator's version label) creates a <code>version:</code> tag that propagates everywhere — enabling version-aware comparison out of the box.",
      u:"https://docs.datadoghq.com/getting_started/tagging/unified_service_tagging/"}
  ]},
  {id:"trouble", name:"Troubleshooting", icon:"\u25BC",
   blurb:"Agent commands, logs, configuration files.",
   questions: [
    /* --- EASY (15) --- */
    {l:"E",q:"Which Agent CLI subcommand shows the current health of the Agent and its integrations?",
      o:["status","health","info","check"], c:0,
      e:"<code>sudo datadog-agent status</code> displays running checks, last collection times, forwarder transactions, and errors.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"E",q:"Which Agent CLI subcommand is used to bundle diagnostic data for a support case?",
      o:["status","flare","config","check"], c:1,
      e:"<code>sudo datadog-agent flare &lt;CASE_ID&gt;</code> packages logs, configs, and runtime info for Datadog Support.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/send_a_flare/"},
    {l:"E",q:"On Linux, where are Agent logs written by default?",
      o:["/var/log/syslog","/var/log/datadog/agent.log","/etc/datadog-agent/log","~/dd.log"], c:1,
      e:"Default Agent log path is <code>/var/log/datadog/agent.log</code> with rotation. trace-agent.log, process-agent.log, etc. sit alongside.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/"},
    {l:"E",q:"Which Agent CLI subcommand runs an integration on demand to see its raw output?",
      o:["check","integration","run","test"], c:0,
      e:"<code>sudo -u dd-agent datadog-agent check &lt;NAME&gt;</code> executes the integration once and prints metrics, events, and service checks.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/agent_check_status/"},
    {l:"E",q:"True or false: tail -f /var/log/datadog/agent.log is a valid way to watch the Agent in real time on Linux.",
      o:["True","False"], c:0,
      e:"True. tail -f streams new lines as they're written — standard for live troubleshooting.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/"},
    {l:"E",q:"Which YAML key enables verbose DEBUG logs in datadog.yaml?",
      o:["log_level: DEBUG","verbose: true","debug: yes","trace: on"], c:0,
      e:"Set <code>log_level: DEBUG</code> in datadog.yaml and restart. Use sparingly — DEBUG logs are noisy and can fill disk.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-configuration-files/"},
    {l:"E",q:"What does running <code>datadog-agent configcheck</code> do?",
      o:["Reloads the Agent","Prints the resolved configuration for each loaded integration (including Autodiscovery)","Sends a test metric","Lists tags"], c:1,
      e:"<code>configcheck</code> shows what config the Agent is actually using after Autodiscovery resolves templates — invaluable for AD debugging.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"E",q:"Which command lists all running integration checks and when they last ran?",
      o:["datadog-agent status","datadog-agent integrations","datadog-agent list","systemctl status"], c:0,
      e:"<code>datadog-agent status</code> includes a 'Running Checks' section per integration with last collection time and any error.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"E",q:"What is the typical permission required to run Agent CLI commands on Linux?",
      o:["root or sudo","Any user","Only the postgres user","No permissions"], c:0,
      e:"Most Agent CLI commands require root/sudo or impersonating <code>dd-agent</code> (e.g., <code>sudo -u dd-agent datadog-agent check ...</code>).",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"E",q:"Where is the per-integration check log captured?",
      o:["Inside the main agent.log, with the check name prefix","A separate log file per check","Datadog UI only","Syslog only"], c:0,
      e:"Per-check logs (errors, warnings) appear in <code>agent.log</code> with the check name in the source field. Increase <code>log_level</code> for more detail.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/"},
    {l:"E",q:"True or false: deleting an integration's conf.yaml requires an Agent restart for the integration to stop running.",
      o:["True","False"], c:1,
      e:"False. The Agent's config watcher detects file changes under conf.d/ and reloads automatically. datadog.yaml changes still need a restart.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"E",q:"Which command prints the Agent's version?",
      o:["datadog-agent version","datadog-agent --version (or 'datadog-agent version')","dd-version","agent-version"], c:1,
      e:"Both <code>datadog-agent version</code> and <code>--version</code> print the running version. Useful when filing support cases.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"E",q:"Which log file would you check first if traces aren't reaching Datadog?",
      o:["agent.log","trace-agent.log","process-agent.log","system-probe.log"], c:1,
      e:"trace-agent.log captures APM intake and forwarding errors. Look for connection-refused or 4xx/5xx from the trace intake.",
      u:"https://docs.datadoghq.com/tracing/troubleshooting/"},
    {l:"E",q:"On Linux, which command shows whether the Agent service is enabled at boot?",
      o:["systemctl status datadog-agent","systemctl is-enabled datadog-agent","ps aux | grep dd","service datadog-agent enabled"], c:1,
      e:"<code>systemctl is-enabled datadog-agent</code> returns 'enabled' or 'disabled'. <code>systemctl status</code> shows whether it's currently running.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"E",q:"Which Agent subcommand specifically diagnoses connectivity to the Datadog intake?",
      o:["datadog-agent check","datadog-agent diagnose","datadog-agent connectivity","datadog-agent flare"], c:1,
      e:"<code>datadog-agent diagnose</code> probes connectivity to required Datadog endpoints and reports actionable failures.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/"},
    /* --- MEDIUM (25) --- */
    {l:"M",q:"You change <code>log_level</code> to DEBUG in datadog.yaml. After how long do new logs reflect DEBUG output?",
      o:["Immediately","After a restart of the Agent","After 10 minutes","Only after reboot"], c:1,
      e:"Changes to datadog.yaml (including log_level) require an Agent restart. Use <code>sudo datadog-agent config set log_level debug</code> for a runtime change.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"M",q:"Which subcommand temporarily sets a runtime config (e.g., log_level) without editing datadog.yaml?",
      o:["datadog-agent config set log_level debug","datadog-agent runtime --log debug","datadog-agent debug","datadog-agent enable debug"], c:0,
      e:"<code>datadog-agent config set</code> changes a runtime-mutable setting without a restart. Useful for short troubleshooting windows.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"M",q:"You see 'API key was not found' in agent.log. What's the most likely root cause?",
      o:["Network outage","Missing/incorrect <code>api_key</code> in datadog.yaml or the value contains whitespace","CPU exhaustion","Disk full"], c:1,
      e:"Confirm <code>api_key:</code> is set and contains no leading/trailing whitespace. Restart the Agent. If correct, verify the key still exists in Org Settings.",
      u:"https://docs.datadoghq.com/account_management/api-app-keys/"},
    {l:"M",q:"Which file path on Linux holds the trace-agent log?",
      o:["/var/log/datadog/trace-agent.log","/etc/datadog-agent/trace-agent.log","/var/lib/datadog/trace.log","/opt/datadog/trace.log"], c:0,
      e:"<code>/var/log/datadog/trace-agent.log</code> is the canonical APM log path on Linux.",
      u:"https://docs.datadoghq.com/tracing/troubleshooting/"},
    {l:"M",q:"You run <code>datadog-agent status</code> and see 'Forwarder transactions in error'. What does that indicate?",
      o:["A bad YAML","The Agent failed to send payloads to the Datadog intake (network/auth)","Disk full","Too many tags"], c:1,
      e:"The forwarder is the component shipping data to Datadog. Errors indicate network failures, TLS issues, or invalid API key. Check <code>diagnose</code> next.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/"},
    {l:"M",q:"An integration's check shows 'Status: ERROR'. Which command yields the integration's traceback?",
      o:["sudo datadog-agent check &lt;INTEGRATION&gt; -l debug","Restart the Agent","Reinstall the integration","Send a flare"], c:0,
      e:"Running <code>check</code> with <code>-l debug</code> outputs the integration's stdout/stderr including Python tracebacks.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/agent_check_status/"},
    {l:"M",q:"Where does <code>datadog-agent flare</code> save the archive when not sent to Support directly?",
      o:["/etc/datadog-agent/flare/","/tmp/datadog-agent/flare-&lt;timestamp&gt;.zip","Datadog UI","Stdout only"], c:1,
      e:"By default the flare is saved under <code>/tmp</code> as a timestamped zip. You can manually upload it from the Datadog UI's support widget.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/send_a_flare/"},
    {l:"M",q:"You can't run <code>datadog-agent status</code> ('connection refused'). Which is the FIRST thing to check?",
      o:["Whether the Agent process is running and the auth_token / cmd_port are readable by the invoking user","API key","Disk usage","Network DNS"], c:0,
      e:"The status command talks to the running daemon over a local IPC port using the auth_token. If the Agent isn't running, or the user can't read the auth_token, it fails.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"M",q:"Which is the safest way to test a YAML file syntax change to an integration?",
      o:["Restart the Agent","Run <code>datadog-agent check &lt;name&gt;</code> after saving the file; YAML errors will be reported","Edit and pray","Delete the file"], c:1,
      e:"<code>check</code> exercises the integration and surfaces YAML/parsing errors immediately, without restarting the whole Agent.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/agent_check_status/"},
    {l:"M",q:"You add a new integration but it doesn't appear in <code>datadog-agent status</code>. Likely cause?",
      o:["Wrong file extension (.yml vs .yaml is fine, but file must be in correct directory)","Misplaced file outside <code>/etc/datadog-agent/conf.d/&lt;name&gt;.d/</code> or syntax error","DNS","Permissions on /proc"], c:1,
      e:"The integration name must match a directory under <code>conf.d/&lt;name&gt;.d/</code>, AND the config must parse. Use <code>configcheck</code> to verify.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"M",q:"How do you confirm what tags the Agent applies to a host's metrics, including those from Autodiscovery?",
      o:["Check datadog.yaml","Run <code>sudo datadog-agent status</code> — 'Host tags' section lists all sources of host-level tags","Trust the dashboard","Look at /etc/hostname"], c:1,
      e:"The status output enumerates host tags grouped by source (datadog.yaml, environment, cloud-provider, etc.).",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"M",q:"Which Linux command prints disk space, useful if you suspect Agent buffers are filling /var?",
      o:["du -sh /var","df -h","ls -al /var","find /var -size"], c:1,
      e:"<code>df -h</code> shows filesystem usage by mountpoint. Use <code>du -sh /var/log/datadog</code> to drill into log size.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/"},
    {l:"M",q:"Which file would you inspect to confirm the Agent's currently active <code>api_key</code>?",
      o:["/etc/datadog-agent/datadog.yaml","/etc/passwd","/var/log/datadog/agent.log (DEBUG only)","Both A; also use <code>datadog-agent config</code> CLI"], c:3,
      e:"datadog.yaml is the source. <code>datadog-agent config</code> CLI prints the runtime view. Avoid leaking the key in logs.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"M",q:"What is the BEST initial Agent troubleshooting workflow for 'metrics aren't showing in Datadog'?",
      o:["1) status, 2) diagnose, 3) confirm DD_SITE & api_key, 4) flare if unresolved","Reinstall first","Restart 10 times","Ignore"], c:0,
      e:"Status → Diagnose → site/key sanity → flare. This is Datadog Support's recommended ladder.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/"},
    {l:"M",q:"Which is true about the Agent's auth_token file?",
      o:["It is the API key","It is a random local token that authorizes CLI ↔ Agent IPC and must be readable by the CLI user","It encrypts metrics","It is unused"], c:1,
      e:"<code>/etc/datadog-agent/auth_token</code> is a random secret used for local IPC authentication. The CLI user (typically root or dd-agent) must be able to read it.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"M",q:"Which log line would indicate misconfigured proxy egress for the Agent?",
      o:["'No api_key configured'","'Forwarder transactions failed: i/o timeout' or TLS errors to api.&lt;site&gt;","Disk full","CPU saturation"], c:1,
      e:"Proxy/firewall issues manifest as forwarder timeouts or TLS handshake errors. Verify <code>proxy</code> settings in datadog.yaml or DD_PROXY_HTTPS env var.",
      u:"https://docs.datadoghq.com/agent/configuration/proxy/"},
    {l:"M",q:"How do you disable an Agent integration WITHOUT deleting its config file?",
      o:["Rename conf.yaml to conf.yaml.bak (the Agent only loads .yaml files)","Set <code>enabled: false</code>","Comment out the entire instances section","All of the above are valid workarounds"], c:3,
      e:"Renaming to .bak removes it from autoload; clearing instances disables checks; some integrations honor an <code>enabled</code> flag. Pick the cleanest for your change-management process.",
      u:"https://docs.datadoghq.com/getting_started/integrations/"},
    {l:"M",q:"Which environment variable would temporarily raise log verbosity for a containerized Agent?",
      o:["DD_LOG_LEVEL=debug","DD_DEBUG=1","DD_VERBOSE=true","DD_TRACE=on"], c:0,
      e:"<code>DD_LOG_LEVEL=debug</code> (env var) takes effect at next container start. Equivalent to setting <code>log_level: debug</code> in datadog.yaml.",
      u:"https://docs.datadoghq.com/agent/guide/environment-variables/"},
    {l:"M",q:"You see 'Datadog Agent is not connected' in the UI for a host. What is a likely cause?",
      o:["Agent process is down or unable to reach api.&lt;site&gt;","Wrong dashboard","Tag mismatch","Browser cache"], c:0,
      e:"The Infrastructure List flag 'Not Connected' means the Agent stopped reporting heartbeats. Check <code>systemctl status</code> and <code>datadog-agent diagnose</code>.",
      u:"https://docs.datadoghq.com/infrastructure/process/?tab=linuxwindows"},
    {l:"M",q:"True or false: <code>datadog-agent jmx collect</code> prints JMX metrics for JMX-based integrations.",
      o:["True","False"], c:0,
      e:"<code>jmx collect</code>, <code>list_matching_attributes</code>, etc., are JMX-specific subcommands for troubleshooting JMXFetch-based integrations (Kafka, Cassandra, etc.).",
      u:"https://docs.datadoghq.com/integrations/java/"},
    {l:"M",q:"What does 'Status: ERROR' next to an integration mean in <code>datadog-agent status</code>?",
      o:["Integration is up","Integration failed on its last collection (look at the error message and traceback shown)","Datadog is down","Network is fine"], c:1,
      e:"It means the last execution raised an exception. The status block includes the message; use <code>check &lt;name&gt; -l debug</code> for the full traceback.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/agent_check_status/"},
    {l:"M",q:"Which environment variable disables the Agent's hostname auto-detection from cloud metadata?",
      o:["DD_CLOUD_PROVIDER_METADATA=''","DD_HOSTNAME=<value>","DD_HOSTNAME_FQDN=false","Setting the hostname explicitly (e.g., DD_HOSTNAME) takes precedence over auto-detection"], c:3,
      e:"Setting <code>DD_HOSTNAME</code> overrides cloud metadata detection. There are also flags to disable specific cloud-provider sources if needed.",
      u:"https://docs.datadoghq.com/agent/faq/how-datadog-agent-determines-the-hostname/"},
    {l:"M",q:"Where does the Agent persist payloads on disk if 'forwarder buffer to disk' is enabled?",
      o:["/var/log/datadog","A configured retry queue path (default under /opt/datadog-agent/run/transactions_retry)","/tmp","Datadog cloud"], c:1,
      e:"With persistent retry enabled, payloads are buffered on disk during network outages. Path is configurable via <code>forwarder_storage_path</code>.",
      u:"https://docs.datadoghq.com/agent/configuration/dual-shipping/"},
    {l:"M",q:"What does an empty 'Running Checks' section in <code>datadog-agent status</code> imply?",
      o:["Agent is healthy","No integration configurations loaded — verify conf.d files and AD config","Datadog UI is down","Logs only"], c:1,
      e:"Means the Agent isn't running any integration. Confirm files exist under conf.d/, no YAML parse errors, and AD listeners are configured for containers.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"M",q:"What is the role of <code>datadog-agent flare</code>'s redaction?",
      o:["Removes any line","Scrubs sensitive values (api_key, passwords) from configs before bundling","Encrypts the flare","Sends data twice"], c:1,
      e:"The flare auto-scrubs known sensitive YAML keys (api_key, password, token) so the support archive can be shared safely.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/send_a_flare/"},
    /* --- HARD (10) --- */
    {l:"H",q:"You see 'Failed to connect to localhost:5001' from the Agent CLI. Which is the MOST LIKELY explanation?",
      o:["DNS","cmd_port mismatch or Agent not running — the CLI talks to the daemon over the local IPC port","Network firewall","TLS expired"], c:1,
      e:"Agent CLI ↔ daemon IPC happens on cmd_port (5001 default for Agent 7). If the Agent isn't up or cmd_port differs in datadog.yaml, connections fail.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"H",q:"You upgrade from Agent 6 to Agent 7 and a custom Python check stops working. Most likely cause?",
      o:["Permissions","Python 2 → Python 3 incompatibility in the custom check code","DNS","CPU"], c:1,
      e:"Agent 7 dropped Python 2. Port the check to Python 3 (or stay on Agent 6 until ported).",
      u:"https://docs.datadoghq.com/agent/"},
    {l:"H",q:"What is the difference between <code>datadog-agent config</code> and <code>datadog-agent config-check</code>?",
      o:["No difference","<code>config</code> prints the runtime resolved global config; <code>configcheck</code> prints loaded integration configs after Autodiscovery","Both are deprecated","Both restart the Agent"], c:1,
      e:"<code>config</code> = effective datadog.yaml + env. <code>configcheck</code> = per-integration resolved templates (key for AD debugging).",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"H",q:"Agent log shows 'Error 403 — Authentication failed'. Which steps in order resolve this fastest?",
      o:["1) Verify <code>api_key</code> length/whitespace; 2) Confirm <code>site</code> matches your org; 3) Test with <code>diagnose</code>; 4) Recreate key in UI if needed","Reboot","Reformat the disk","Reinstall the OS"], c:0,
      e:"403 = key invalid (typo, deleted, or wrong site). Verify key value, confirm <code>DD_SITE</code>, run <code>diagnose</code>, and recreate as last resort.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/"},
    {l:"H",q:"You see thousands of 'Tag cardinality' warnings in agent.log. What does this indicate?",
      o:["Network issue","An integration or DogStatsD client is producing tags with high cardinality — review tag values before billing spikes","Disk full","Memory leak"], c:1,
      e:"The Agent emits cardinality warnings for metrics whose unique tag combinations exceed thresholds. Review and reduce — high cardinality drives custom-metric cost.",
      u:"https://docs.datadoghq.com/metrics/custom_metrics/"},
    {l:"H",q:"Which combination of files would you inspect to diagnose 'logs not arriving for one container only'?",
      o:["agent.log + the AD <code>logs:</code> template for that container + container stdout permissions","Only datadog.yaml","Only DNS","No logs are needed"], c:0,
      e:"Diagnose log delivery: confirm <code>logs_enabled: true</code>, AD <code>logs:</code> annotation on the pod, container stdout/stderr accessible, and no errors in <code>logs.log</code>.",
      u:"https://docs.datadoghq.com/containers/kubernetes/log/"},
    {l:"H",q:"What is the role of <code>system-probe.log</code>?",
      o:["Agent main log","Logs for the system-probe component used by NPM, USM, Cloud Workload Security, etc.","DNS logs","Audit log"], c:1,
      e:"system-probe is a separate Agent component that loads eBPF/probes for Network/Universal Service Monitoring and security features. It logs to <code>system-probe.log</code>.",
      u:"https://docs.datadoghq.com/network_monitoring/performance/"},
    {l:"H",q:"You modify <code>conf.d/postgres.d/conf.yaml</code> with a bad regex and the Agent silently stops collecting Postgres metrics. Which command would have caught it?",
      o:["datadog-agent status","datadog-agent check postgres -l debug","datadog-agent flare","No way to catch"], c:1,
      e:"Running <code>check postgres -l debug</code> exercises the integration with verbose output, showing the regex error before you wait for status.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/agent_check_status/"},
    {l:"H",q:"On Windows, where does the Agent write logs by default?",
      o:["C:\\ProgramData\\Datadog\\logs\\","%TEMP%\\","C:\\Windows\\System32\\","Event Viewer only"], c:0,
      e:"On Windows the Agent uses <code>C:\\ProgramData\\Datadog\\logs\\</code> for agent.log, trace-agent.log, etc.",
      u:"https://docs.datadoghq.com/agent/basic_agent_usage/windows/"},
    {l:"H",q:"You enable persistent forwarder buffering. What is the practical implication for short network outages?",
      o:["No effect","Data is buffered to disk and replayed when the network returns, reducing data loss during transient outages","Data is dropped to disk","Agent crashes"], c:1,
      e:"Persistent buffering writes payloads to disk during outages. When connectivity returns, the Agent replays them. Important for unreliable links and during planned maintenance.",
      u:"https://docs.datadoghq.com/agent/configuration/dual-shipping/"}
  ]},
  {id:"viz", name:"Visualization & Utilization", icon:"\u25C7",
   blurb:"Host Map, dashboards, metrics, tags, monitors & alerts.",
   questions: [
    /* --- EASY (15) --- */
    {l:"E",q:"Which Datadog page gives a 2-D visualization of all hosts grouped and filtered by tags, with size and color encoding metrics?",
      o:["Host Map","Service Map","Logs Explorer","Dashboards"], c:0,
      e:"Host Map (and the Host Map dashboard widget) lays out hosts grouped/filtered/sized/colored by tags & metrics.",
      u:"https://docs.datadoghq.com/infrastructure/hostmap/"},
    {l:"E",q:"Which dashboard widget displays a single metric's current value with optional conditional coloring?",
      o:["Timeseries","Query Value","Top List","Hostmap"], c:1,
      e:"The Query Value widget shows a single number and can be colored by thresholds — perfect for KPI tiles.",
      u:"https://docs.datadoghq.com/dashboards/widgets/query_value/"},
    {l:"E",q:"Which widget plots a metric over time?",
      o:["Timeseries","Query Value","Toplist","Pie"], c:0,
      e:"The Timeseries widget renders one or more metric queries over a time range.",
      u:"https://docs.datadoghq.com/dashboards/widgets/timeseries/"},
    {l:"E",q:"Which widget shows a ranked list (top N) of tag values for a metric?",
      o:["Top List","Timeseries","Query Value","Tablespace"], c:0,
      e:"The Top List widget displays a ranked list of tag values for the chosen metric and aggregation.",
      u:"https://docs.datadoghq.com/dashboards/widgets/top_list/"},
    {l:"E",q:"What is the BEST description of a Datadog monitor?",
      o:["A graph","A condition over data (metric, log query, service check, etc.) that triggers notifications when it crosses a threshold","A user","A tag"], c:1,
      e:"Monitors evaluate a query against a threshold (or anomaly, forecast, etc.) and notify on state transitions.",
      u:"https://docs.datadoghq.com/monitors/"},
    {l:"E",q:"Which monitor type alerts on a static value crossing a threshold?",
      o:["Metric (threshold)","Composite","Anomaly","Forecast"], c:0,
      e:"Metric (threshold) monitors compare a metric's value to fixed thresholds (warning and alert).",
      u:"https://docs.datadoghq.com/monitors/types/metric/"},
    {l:"E",q:"What does a 'composite' monitor do?",
      o:["Sums metrics","Combines multiple existing monitors with boolean logic (AND/OR/!) into one alert","Plots time-series","Sends emails"], c:1,
      e:"Composite monitors reference other monitors by ID and combine their states with logical operators.",
      u:"https://docs.datadoghq.com/monitors/types/composite/"},
    {l:"E",q:"Which Datadog monitor type uses ML to alert on unusual behavior?",
      o:["Anomaly Detection","Composite","Service Check","Metric"], c:0,
      e:"Anomaly monitors use an algorithmic baseline that learns seasonality and trends to alert on deviations.",
      u:"https://docs.datadoghq.com/monitors/types/anomaly/"},
    {l:"E",q:"True or false: Datadog has only one dashboard type today.",
      o:["True","False"], c:0,
      e:"True. Datadog merged Timeboards and Screenboards into a single 'Dashboards' type with both timeseries and screen-like layouts.",
      u:"https://docs.datadoghq.com/dashboards/"},
    {l:"E",q:"What is the function of a dashboard 'template variable'?",
      o:["Replaces metric names","Lets users filter all widgets on a dashboard by a tag value (e.g., env, host)","Restarts the Agent","Adds a comment"], c:1,
      e:"Template variables drive interactive filters that propagate to all widgets — essential for reusable dashboards.",
      u:"https://docs.datadoghq.com/dashboards/template_variables/"},
    {l:"E",q:"What does the <code>avg by {service}</code> clause in a Datadog query do?",
      o:["Restarts the Agent","Aggregates values into one series per unique <code>service</code> tag","Renames metrics","Hides services"], c:1,
      e:"<code>by {tag}</code> groups time-series by that tag, producing one series per unique value. <code>avg/sum/max/min</code> are the aggregation function.",
      u:"https://docs.datadoghq.com/dashboards/querying/"},
    {l:"E",q:"True or false: tags can be used to filter monitors, dashboards, and queries.",
      o:["True","False"], c:0,
      e:"True. Tags are the universal filter dimension across metrics, monitors, dashboards, logs, traces, and infrastructure views.",
      u:"https://docs.datadoghq.com/getting_started/tagging/using_tags/"},
    {l:"E",q:"Which is a valid notification channel for a Datadog monitor?",
      o:["Email","Slack","PagerDuty / Opsgenie / webhooks","All of the above"], c:3,
      e:"Monitors support email, Slack, PagerDuty, Opsgenie, webhooks, Microsoft Teams, and many more via integrations.",
      u:"https://docs.datadoghq.com/monitors/notify/"},
    {l:"E",q:"In Host Map, what does the 'Fill by' option control?",
      o:["The host's hostname","The color of each host hexagon (based on a metric)","Network speed","Tag count"], c:1,
      e:"'Fill by' colors each host by a chosen metric (e.g., CPU usage). 'Group by' clusters hosts by tag; 'Filter by' subsets them.",
      u:"https://docs.datadoghq.com/dashboards/widgets/hostmap/"},
    {l:"E",q:"True or false: a dashboard can use both metric queries and log query widgets.",
      o:["True","False"], c:0,
      e:"True. Dashboards aggregate any Datadog data source (metrics, logs, traces, RUM, synthetics, etc.) on the same canvas.",
      u:"https://docs.datadoghq.com/dashboards/widgets/"},
    /* --- MEDIUM (25) --- */
    {l:"M",q:"You want a monitor to evaluate the last 5 minutes of a metric and compare it to a fixed threshold. Which monitor type fits BEST?",
      o:["Metric (threshold)","Service Check","Composite","Forecast"], c:0,
      e:"Threshold metric monitors evaluate over a configurable 'evaluation window' (e.g., last 5m) against a static threshold.",
      u:"https://docs.datadoghq.com/monitors/types/metric/"},
    {l:"M",q:"Which dashboard widget is BEST suited to show the rate of requests per second across services with stacked colors?",
      o:["Stacked Timeseries (Timeseries widget with 'Area' or 'Bars' and stacking)","Toplist","Pie","Hostmap"], c:0,
      e:"Timeseries with stacked area/bar display works well for cumulative throughput across grouping. <code>by {service}</code> drives the colors.",
      u:"https://docs.datadoghq.com/dashboards/widgets/timeseries/"},
    {l:"M",q:"What does '@user.email' do in a monitor notification template?",
      o:["Sets a variable","Sends the notification to the email address user.email","Filters the alert","Logs the alert"], c:1,
      e:"Using <code>@email@domain.com</code> in the monitor message sends a notification to that email. Templated values like <code>{{host.name}}</code> are also supported.",
      u:"https://docs.datadoghq.com/monitors/notify/"},
    {l:"M",q:"Which is a valid <code>@-mention</code> for Slack?",
      o:["@slack-channel-name","@user","@slack-&lt;workspace&gt;-&lt;channel&gt;","Email"], c:2,
      e:"Slack mentions use the form <code>@slack-&lt;workspace&gt;-&lt;channel&gt;</code> matching the configured Slack integration in Datadog.",
      u:"https://docs.datadoghq.com/integrations/slack/"},
    {l:"M",q:"Which BEST describes 'monitor states'?",
      o:["Active / inactive","OK, Warn, Alert, No Data, Unknown (Service Check only)","On / Off","Green / Red"], c:1,
      e:"Datadog monitors transition through OK, WARN (Warning), ALERT (Critical), NO DATA. Service Check monitors also have UNKNOWN.",
      u:"https://docs.datadoghq.com/monitors/"},
    {l:"M",q:"What is the function of 'No Data' alerts on a monitor?",
      o:["Suppresses alerts","Triggers an alert when the metric stops reporting for a configured window","Forwards data","Replays missed data"], c:1,
      e:"No-Data alerts catch silent failures (Agent down, process crashed) by triggering when data stops arriving for N minutes.",
      u:"https://docs.datadoghq.com/monitors/notify/"},
    {l:"M",q:"You want to ensure a monitor doesn't fire during planned maintenance. Which feature should you use?",
      o:["Downtimes (one-time or recurring)","Delete the monitor","Pause Datadog","Lower the threshold"], c:0,
      e:"Downtimes mute one or many monitors for a window (one-time or recurring) without modifying their config.",
      u:"https://docs.datadoghq.com/monitors/downtimes/"},
    {l:"M",q:"What does the 'group by' choice in a metric monitor affect?",
      o:["Notification channel","Whether the monitor evaluates per-tag (multi-alert) or as a single aggregate","Whether the monitor is composite","API key"], c:1,
      e:"Group-by turns a monitor into a 'multi-alert' that evaluates per tag value and alerts independently per group.",
      u:"https://docs.datadoghq.com/monitors/types/metric/"},
    {l:"M",q:"Which is a valid Host Map use case?",
      o:["Spotting a noisy host whose CPU is much higher than peers via color","Reading a log","Sending an email","Reconciling a bill"], c:0,
      e:"Host Map visualizes outliers across a fleet — instantly spot high CPU, memory, or any chosen metric.",
      u:"https://docs.datadoghq.com/infrastructure/hostmap/"},
    {l:"M",q:"Which monitor type checks the status of an integration's service (OK/WARNING/CRITICAL)?",
      o:["Service Check","Anomaly","Forecast","Composite"], c:0,
      e:"Service Check monitors alert on transitions between OK/WARNING/CRITICAL/UNKNOWN status codes emitted by integrations.",
      u:"https://docs.datadoghq.com/monitors/types/service_check/"},
    {l:"M",q:"You want to forecast disk usage and alert before it fills. Which monitor type fits?",
      o:["Forecast","Anomaly","Threshold","Composite"], c:0,
      e:"Forecast monitors project a metric into the future based on past data and alert when it's predicted to cross a threshold.",
      u:"https://docs.datadoghq.com/monitors/types/forecasts/"},
    {l:"M",q:"True or false: any dashboard widget can be exported as an alert by 'Create Monitor' from the widget.",
      o:["True","False"], c:0,
      e:"True. Most metric widgets offer a 'Create Monitor' shortcut that opens the monitor builder pre-filled with the widget's query.",
      u:"https://docs.datadoghq.com/dashboards/widgets/"},
    {l:"M",q:"Which is true about dashboard 'preset' (system) dashboards?",
      o:["You can edit them directly","They are read-only; clone them to make changes","They are unavailable in trial accounts","They are user-specific"], c:1,
      e:"Datadog ships preset dashboards (per integration). They are read-only — clone them to customize.",
      u:"https://docs.datadoghq.com/dashboards/"},
    {l:"M",q:"Which Datadog query function applies a moving rollup over a window?",
      o:["moving_rollup()","rollup() / .rollup(avg, 60)","ewma()","avg_by"], c:1,
      e:"<code>.rollup(method, seconds)</code> applies an explicit aggregation over fixed buckets — useful when comparing across time windows.",
      u:"https://docs.datadoghq.com/dashboards/querying/"},
    {l:"M",q:"You have a 'multi-alert' monitor grouped by service. A new service appears. Will the monitor evaluate it?",
      o:["Yes, the multi-alert evaluates each new group as it appears","No, you must manually edit it","Only after a rebuild","Only with API"], c:0,
      e:"Multi-alerts evaluate per-group dynamically. New tag values are automatically included.",
      u:"https://docs.datadoghq.com/monitors/types/metric/"},
    {l:"M",q:"Which is true about 'log monitors'?",
      o:["They alert on metric thresholds","They alert when a log query exceeds a count threshold (or matches a pattern) within a window","They alert on traces","They alert on events"], c:1,
      e:"Log monitors run a log query and alert when matching log volume exceeds the configured threshold over the eval window.",
      u:"https://docs.datadoghq.com/monitors/types/log/"},
    {l:"M",q:"True or false: when grouping a monitor by 'host', you create a per-host alert that fires independently for each host.",
      o:["True","False"], c:0,
      e:"True. <code>by {host}</code> creates a multi-alert evaluated per host — independent transitions and notifications.",
      u:"https://docs.datadoghq.com/monitors/types/metric/"},
    {l:"M",q:"Which dashboard widget visualizes service-to-service dependencies?",
      o:["Service Map","Toplist","Pie","Hostmap"], c:0,
      e:"The Service Map widget (and APM Service Map page) visualizes upstream/downstream dependencies derived from APM traces.",
      u:"https://docs.datadoghq.com/tracing/services/services_list/"},

/* ====== STATE & ENGINE ====== */
const state = {
  domainIdx:0, qIdx:0,
  order:[],         // shuffled order
  answers:{},       // {domainId: {qIndex: {chosen:n, correct:bool}}}
  reviewMode:false
};

const $ = (sel)=>document.querySelector(sel);
const el = (tag,props={},...kids)=>{
  const e = document.createElement(tag);
  for (const k in props){
    if (k === "class") e.className = props[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), props[k]);
    else if (k === "html") e.innerHTML = props[k];
    else e.setAttribute(k, props[k]);
  }
  kids.forEach(k=>{ if(k!=null) e.appendChild(typeof k==="string"?document.createTextNode(k):k); });
  return e;
};

function curDomain(){ return DOMAINS[state.domainIdx]; }
function curQList(){
  const d = curDomain();
  if (state.reviewMode){
    const a = state.answers[d.id] || {};
    return state.order.filter(i => a[i] && a[i].correct === false);
  }
  return state.order;
}
function renderTabs(){
  const tabs = $("#tabs"); tabs.innerHTML = "";
  DOMAINS.forEach((d,i)=>{
    const t = el("div",{class:"tab"+(i===state.domainIdx?" active":""),
      onclick:()=>{state.domainIdx=i;state.qIdx=0;state.reviewMode=false;initDomain();}},
      d.icon+"  "+d.name,
      el("span",{class:"badge"}, String(d.questions.length))
    );
    tabs.appendChild(t);
  });
}

function initDomain(){
  const d = curDomain();
  state.order = d.questions.map((_,i)=>i);
  state.qIdx = 0;
  if (!state.answers[d.id]) state.answers[d.id] = {};
  renderTabs(); render();
}

function shuffle(arr){
  for (let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

function letter(i){ return ["A","B","C","D","E"][i]; }

function render(){
  const d = curDomain();
  const list = curQList();
  const totalAns = Object.values(state.answers[d.id]||{});
  const correct = totalAns.filter(x=>x.correct).length;
  const wrong = totalAns.filter(x=>!x.correct).length;
  const answered = totalAns.length;
  $("#stDomain").textContent = d.name;
  $("#stCorrect").textContent = correct;
  $("#stWrong").textContent = wrong;
  $("#stScore").textContent = answered ? Math.round(100*correct/answered)+"%" : "—";
  $("#progressBar").style.width = list.length ? (100*state.qIdx/list.length)+"%" : "0%";
  $("#stPos").textContent = (list.length?state.qIdx+1:0)+" / "+list.length;

  const area = $("#quizArea"); area.innerHTML = "";

  if (!list.length){
    area.appendChild(el("div",{class:"panel empty"},
      state.reviewMode ? "No incorrect answers to review in this domain. Nice!" : "No questions in this domain."));
    return;
  }
  if (state.qIdx >= list.length){
    renderSummary(area); return;
  }

  const qi = list[state.qIdx];
  const q = d.questions[qi];
  const card = el("div",{class:"panel qcard"});
  const meta = el("div",{class:"qmeta"},
    el("span",{class:"pill "+q.l}, q.l==="E"?"Easy":q.l==="M"?"Medium":"Hard"),
    el("span",{}, "Question "+(state.qIdx+1)+" of "+list.length),
    el("span",{}, "· Domain: "+d.name)
  );
  card.appendChild(meta);
  card.appendChild(el("div",{class:"qtext", html:q.q}));

  const opts = el("div",{class:"options"});
  const prev = state.answers[d.id][qi];

  q.o.forEach((text,oi)=>{
    let cls = "opt";
    if (prev){
      cls += " disabled";
      if (oi === q.c) cls += " correct";
      else if (oi === prev.chosen) cls += " incorrect";
    }
    const o = el("button",{class:cls, html:""},
      el("span",{class:"letter"}, letter(oi)+"."),
      el("span",{html:text})
    );
    if (!prev){
      o.addEventListener("click", ()=>chooseAnswer(qi,oi));
    }
    opts.appendChild(o);
  });
  card.appendChild(opts);

  // Explanation
  const exp = el("div",{class:"explanation"+(prev?" shown":"")});
  if (prev){
    const tag = el("span",{class:"label "+(prev.correct?"ok":"bad")},
      prev.correct?"Correct":"Incorrect");
    exp.appendChild(tag);
    exp.appendChild(el("span",{html:" The correct answer is <b>"+letter(q.c)+"</b>. "+q.e}));
    if (q.u){
      const a = el("a",{href:q.u, target:"_blank", rel:"noopener", class:"doc"},
        "\u2192 Official documentation: "+q.u);
      exp.appendChild(a);
    }
  }
  card.appendChild(exp);

  // Nav
  const nav = el("div",{class:"nav"});
  const prevBtn = el("button",{class:"btn", onclick:()=>{
    if (state.qIdx>0){state.qIdx--;render();}
  }}, "\u2190 Previous");
  prevBtn.disabled = state.qIdx===0;
  const nextBtn = el("button",{class:"btn primary", onclick:()=>{
    state.qIdx++; render();
  }}, state.qIdx===list.length-1?"Finish \u2192":"Next \u2192");
  if (!prev) nextBtn.disabled = true;
  nav.appendChild(prevBtn); nav.appendChild(nextBtn);
  card.appendChild(nav);

  area.appendChild(card);
}

function chooseAnswer(qi, chosen){
  const d = curDomain();
  const q = d.questions[qi];
  state.answers[d.id][qi] = { chosen, correct: chosen === q.c };
  render();
}

function renderSummary(area){
  const d = curDomain();
  const list = curQList();
  const a = state.answers[d.id] || {};
  const answered = list.map(i=>a[i]).filter(Boolean);
  const correct = answered.filter(x=>x.correct).length;
  const pct = answered.length ? Math.round(100*correct/answered.length) : 0;
  const cls = pct>=80?"good":pct>=65?"mid":"bad";
  const verdict = pct>=80?"You are exam-ready on this domain. 🎯"
                : pct>=65?"Solid — review the missed questions and re-take."
                : "Needs more study. Re-read the docs for the missed questions.";

  const wrap = el("div",{class:"panel summary"});
  wrap.appendChild(el("div",{}, "Domain complete: "+d.name));
  wrap.appendChild(el("div",{class:"score "+cls}, pct+"%"));
  wrap.appendChild(el("div",{}, correct+" correct of "+answered.length));
  wrap.appendChild(el("div",{html:"<br>"+verdict}));
  const nav = el("div",{class:"nav", style:"justify-content:center;margin-top:18px"});
  nav.appendChild(el("button",{class:"btn primary",onclick:()=>{
    state.reviewMode = true;
    state.qIdx = 0;
    render();
  }}, "Review missed only"));
  nav.appendChild(el("button",{class:"btn",onclick:()=>{
    state.reviewMode = false;
    state.qIdx = 0;
    render();
  }}, "Restart this domain"));
  nav.appendChild(el("button",{class:"btn",onclick:()=>{
    if (state.domainIdx < DOMAINS.length-1){
      state.domainIdx++; initDomain();
    }
  }}, "Next domain \u2192"));
  wrap.appendChild(nav);
  area.appendChild(wrap);
}

$("#shuffleBtn").addEventListener("click",()=>{
  shuffle(state.order); state.qIdx = 0; state.reviewMode=false; render();
});
$("#resetBtn").addEventListener("click",()=>{
  const d = curDomain();
  if (confirm("Clear your answers for "+d.name+"?")){
    state.answers[d.id] = {};
    state.qIdx = 0;
    state.reviewMode = false;
    render();
  }
});
$("#reviewBtn").addEventListener("click",()=>{
  state.reviewMode = !state.reviewMode;
  state.qIdx = 0; render();
});

initDomain();
</script>
</body>
