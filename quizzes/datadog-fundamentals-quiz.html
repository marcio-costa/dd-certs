<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datadog Fundamentals Quiz — Marcio</title>
<style>
  :root{
    --bg:#0f1117;--panel:#171a23;--panel2:#1e2230;--border:#2a2f3d;
    --text:#e6e8ee;--mute:#9aa0ad;--accent:#774aff;--accent2:#9b7bff;
    --ok:#2ecc71;--bad:#ff5566;--warn:#ffb02e;--code:#0c0e15;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  a{color:var(--accent2);text-decoration:none;border-bottom:1px dotted var(--accent2)}
  a:hover{color:#cab8ff}
  header{padding:18px 24px;border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#191c27,#13151d);position:sticky;top:0;z-index:5}
  h1{margin:0 0 4px 0;font-size:20px;letter-spacing:.2px}
  .sub{color:var(--mute);font-size:13px}
  main{max-width:1100px;margin:0 auto;padding:18px 20px 80px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 16px}
  .tab{padding:9px 14px;background:var(--panel);border:1px solid var(--border);
    border-radius:10px;cursor:pointer;color:var(--text);font-size:13px;
    display:flex;align-items:center;gap:8px;transition:.15s}
  .tab:hover{background:var(--panel2)}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab .badge{background:rgba(255,255,255,.1);padding:1px 7px;border-radius:999px;font-size:11px}
  .tab.active .badge{background:rgba(0,0,0,.25)}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
  .btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:.15s}
  .btn:hover{background:#252b3b}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#8a5fff}
  .progress{flex:1;height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;min-width:160px}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.3s}
  .stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
  .stat b{color:var(--text)}
  .qcard{margin-top:8px}
  .qmeta{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:12px;margin-bottom:8px}
  .pill{padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.3px;text-transform:uppercase}
  .pill.E{background:#1e3a2a;color:#7ee2a5}
  .pill.M{background:#3a311e;color:#ffd591}
  .pill.H{background:#3a1e26;color:#ff96a4}
  .qtext{font-size:16px;line-height:1.5;margin:4px 0 14px;font-weight:500}
  .options{display:grid;gap:8px;margin-bottom:10px}
  .opt{padding:11px 14px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    cursor:pointer;text-align:left;color:var(--text);font-size:14px;transition:.15s;display:flex;gap:10px}
  .opt:hover:not(.disabled){background:#252b3b;border-color:#3a4156}
  .opt.disabled{cursor:default}
  .opt .letter{font-weight:700;color:var(--mute);min-width:18px}
  .opt.correct{background:#1c3d2a;border-color:#2ecc71;color:#d6f5e1}
  .opt.correct .letter{color:#2ecc71}
  .opt.incorrect{background:#3d1c24;border-color:#ff5566;color:#f5d6dc}
  .opt.incorrect .letter{color:#ff5566}
  .opt.was-correct{background:rgba(46,204,113,.08);border-color:rgba(46,204,113,.4)}
  .explanation{margin-top:12px;padding:14px;background:var(--code);border:1px solid var(--border);
    border-radius:10px;display:none;font-size:14px}
  .explanation.shown{display:block;animation:fade .2s ease}
  .explanation .label{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;
    font-weight:700;letter-spacing:.5px;margin-right:8px;text-transform:uppercase}
  .explanation .label.ok{background:#1c3d2a;color:#7ee2a5}
  .explanation .label.bad{background:#3d1c24;color:#ff96a4}
  .explanation .doc{display:block;margin-top:10px;font-size:13px}
  .nav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .summary{padding:22px;text-align:center}
  .summary .score{font-size:42px;font-weight:700;margin:8px 0}
  .summary .score.good{color:var(--ok)}
  .summary .score.mid{color:var(--warn)}
  .summary .score.bad{color:var(--bad)}
  .breakdown{display:grid;gap:8px;margin-top:14px}
  .breakdown .row{display:flex;justify-content:space-between;padding:8px 12px;background:var(--panel2);border-radius:8px;font-size:13px}
  .empty{padding:30px;text-align:center;color:var(--mute)}
  details{margin-top:8px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
  details > summary{cursor:pointer;color:var(--mute);font-size:13px}
  kbd{background:var(--code);border:1px solid var(--border);border-bottom-width:2px;
    padding:1px 6px;border-radius:4px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
  code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
  @keyframes fade{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}
  @media(max-width:640px){.qtext{font-size:15px}.stats{font-size:12px}}
</style>
</head>
<body>
<header>
  <h1>Datadog Fundamentals — Practice Quiz</h1>
  <div class="sub">~300 questions across 6 official exam domains · Immediate feedback with documentation links · Built for Marcio</div>
</header>

<main>
  <div class="panel">
    <div class="controls">
      <button class="btn" id="shuffleBtn">Shuffle questions</button>
      <button class="btn" id="resetBtn">Reset domain</button>
      <button class="btn" id="reviewBtn">Review missed</button>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
    <div class="stats">
      <span class="stat">Domain: <b id="stDomain">—</b></span>
      <span class="stat">Question: <b id="stPos">0 / 0</b></span>
      <span class="stat">Correct: <b id="stCorrect">0</b></span>
      <span class="stat">Incorrect: <b id="stWrong">0</b></span>
      <span class="stat">Score: <b id="stScore">—</b></span>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="quizArea"></div>
</main>

<script>
/* ====== QUESTION BANK ======
   Each question schema:
   q  : question text (HTML allowed)
   o  : options array (4)
   c  : correct option index (0-3)
   e  : explanation (HTML allowed)
   u  : documentation URL
   l  : difficulty (E/M/H)
*/
const DOMAINS = [
  {id:"essential", name:"Essential Concepts", icon:"\u25CF",
   blurb:"Hardware, networking, config files, observability fundamentals.",
   questions: [
    /* --- EASY (15) --- */
    {l:"E",q:"Which of the three pillars of observability captures discrete events with rich, structured context (e.g., a request error with stack trace and user ID)?",
      o:["Metrics","Logs","Traces","Profiles"], c:1,
      e:"Logs are timestamped records of discrete events with rich context. Metrics are numeric measurements aggregated over time; traces follow a request across services; profiles capture code-level performance.",
      u:"https://docs.datadoghq.com/logs/"},
    {l:"E",q:"What does CPU stand for?",
      o:["Central Processing Unit","Compute Performance Utility","Core Processor Underclock","Common Programming Unit"], c:0,
      e:"CPU = Central Processing Unit. Datadog reports CPU usage as a host-level metric (system.cpu.user, system.cpu.system, etc.).",
      u:"https://docs.datadoghq.com/integrations/system/"},
    {l:"E",q:"Which file format does the Datadog Agent use for its main configuration file?",
      o:["JSON","YAML","XML","INI"], c:1,
      e:"datadog.yaml is YAML-formatted. Integration configurations under conf.d/&lt;integration&gt;.d/conf.yaml are also YAML.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-configuration-files/"},
    {l:"E",q:"In a YAML configuration file, what is the most common cause of a 'mapping values are not allowed here' parsing error?",
      o:["Using tabs instead of spaces for indentation","Comments starting with #","Quoted strings","Multi-line values"], c:0,
      e:"YAML requires consistent space-based indentation. Tabs are disallowed and the most frequent cause of parse failures in datadog.yaml.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/yaml-parsing/"},
    {l:"E",q:"Which Linux command displays the running processes on a host?",
      o:["ls","ps","cd","grep"], c:1,
      e:"<code>ps</code> reports running processes. <code>ls</code> lists files, <code>cd</code> changes directories, <code>grep</code> searches text.",
      u:"https://docs.datadoghq.com/integrations/process/"},
    {l:"E",q:"Which observability data type is best described as 'a numerical measurement aggregated over time'?",
      o:["Log","Metric","Trace","Event"], c:1,
      e:"Metrics are numeric measurements collected and aggregated over time intervals (e.g., CPU %, request count per second).",
      u:"https://docs.datadoghq.com/metrics/"},
    {l:"E",q:"What does RAM stand for?",
      o:["Random Access Memory","Rapid Allocation Module","Read-Aligned Memory","Runtime Application Memory"], c:0,
      e:"RAM = Random Access Memory. Datadog's system.mem.* metrics report memory usage.",
      u:"https://docs.datadoghq.com/integrations/system/"},
    {l:"E",q:"Which networking protocol is connection-oriented and guarantees delivery?",
      o:["UDP","TCP","ICMP","ARP"], c:1,
      e:"TCP is connection-oriented and reliable (3-way handshake, retransmissions). UDP is connectionless and best-effort. Datadog Agent uses TCP to ship most data to the intake.",
      u:"https://docs.datadoghq.com/agent/configuration/network/"},
    {l:"E",q:"What is the default character used to comment a line in a YAML file?",
      o:["//","#","--","/*"], c:1,
      e:"YAML comments begin with <code>#</code>. Anything after # on a line is ignored by the parser.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-configuration-files/"},
    {l:"E",q:"Which TCP port does HTTPS traffic use by default?",
      o:["21","22","80","443"], c:3,
      e:"HTTPS uses TCP port 443. Datadog Agent outbound traffic to the intake uses HTTPS on port 443 (in addition to other ports for specific products).",
      u:"https://docs.datadoghq.com/agent/configuration/network/"},
    {l:"E",q:"What does an IP address uniquely identify on a network?",
      o:["A user","A network interface","A file","An application port"], c:1,
      e:"An IP address identifies a network interface on a host. Ports identify processes/services on that host.",
      u:"https://docs.datadoghq.com/agent/configuration/network/"},
    {l:"E",q:"Which of the following is a structured data format commonly used for API responses?",
      o:["CSV","JSON","SVG","PDF"], c:1,
      e:"JSON (JavaScript Object Notation) is the standard format for Datadog API requests and responses.",
      u:"https://docs.datadoghq.com/api/latest/"},
    {l:"E",q:"In the context of observability, what is 'metadata'?",
      o:["Raw metric values","Information about data — like tags, source, host, environment","Database transactions","Logs from a specific service"], c:1,
      e:"Metadata is descriptive context attached to telemetry (host, env, service, version, integration tags). It enables filtering, grouping, and correlation across Datadog.",
      u:"https://docs.datadoghq.com/getting_started/tagging/"},
    {l:"E",q:"Which Linux command prints the current working directory?",
      o:["pwd","cwd","dir","whoami"], c:0,
      e:"<code>pwd</code> = print working directory. Useful when locating Datadog Agent config files like /etc/datadog-agent/datadog.yaml.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-configuration-files/"},
    {l:"E",q:"In observability, what does 'cardinality' refer to?",
      o:["The number of CPUs in a host","The number of unique tag combinations on a metric","The total bytes ingested","The retention period"], c:1,
      e:"Cardinality is the number of unique tag-value combinations for a metric. High cardinality drives custom-metric cost and can degrade query performance.",
      u:"https://docs.datadoghq.com/metrics/custom_metrics/"},
    /* --- MEDIUM (25) --- */
    {l:"M",q:"You edit <code>/etc/datadog-agent/datadog.yaml</code> on a Linux host. What MUST you do for the change to take effect?",
      o:["Nothing — the Agent reloads YAML changes automatically","Restart the Datadog Agent service","Run <code>datadog-agent flare</code>","Reboot the operating system"], c:1,
      e:"Most changes to datadog.yaml require restarting the Agent: <code>sudo systemctl restart datadog-agent</code> (Linux). The Agent does not auto-reload its main config.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"M",q:"You see the following snippet in a YAML config file. Which line is invalid?<br><code>instances:<br>  - host: db01<br>    port: 5432<br>\ttags:<br>      - env:prod</code>",
      o:["The first line","The host line","The line beginning with a tab","The tags list"], c:2,
      e:"YAML forbids tabs for indentation. Replace the leading tab with spaces or you will get a parser error.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/yaml-parsing/"},
    {l:"M",q:"Which statement BEST describes the difference between TCP and UDP?",
      o:["TCP is unreliable and stateless; UDP is reliable and stateful","TCP is connection-oriented and reliable; UDP is connectionless and best-effort","TCP and UDP are identical at the transport layer","UDP requires a 3-way handshake; TCP does not"], c:1,
      e:"TCP provides reliable, ordered, connection-oriented delivery (3-way handshake). UDP is connectionless and best-effort — used by DogStatsD on port 8125 for low-overhead metric submission.",
      u:"https://docs.datadoghq.com/agent/configuration/network/"},
    {l:"M",q:"A team wants to capture the rate of failed login attempts AND alert on a spike. Which two telemetry types are MOST appropriate?",
      o:["Logs and metrics","Traces and profiles","Real User Monitoring and synthetics","Network performance monitoring and Topology"], c:0,
      e:"Logs capture each failed-login event with context; a metric (custom or generated from logs) provides the time-series needed for monitor alerting.",
      u:"https://docs.datadoghq.com/logs/log_configuration/logs_to_metrics/"},
    {l:"M",q:"Which HTTP status code class indicates a client-side error?",
      o:["2xx","3xx","4xx","5xx"], c:2,
      e:"4xx codes signal client errors (400 Bad Request, 401 Unauthorized, 404 Not Found). 5xx are server errors. Datadog APM and Logs surface both classes in error-rate dashboards.",
      u:"https://docs.datadoghq.com/tracing/services/services_list/"},
    {l:"M",q:"What does 'observability' fundamentally aim to answer?",
      o:["How many servers are running","Why a system is behaving the way it is, from the outside","What software is licensed","Which firewall rules are active"], c:1,
      e:"Observability lets you ask new questions about a system's internal state from its external outputs (metrics, logs, traces). It is broader than traditional monitoring, which checks pre-defined conditions.",
      u:"https://docs.datadoghq.com/getting_started/"},
    {l:"M",q:"In a Datadog Agent integration YAML, instances are listed under which top-level key?",
      o:["init_config","instances","logs","ad_identifiers"], c:1,
      e:"Each integration file has <code>init_config</code> (shared settings) and <code>instances</code> (one entry per monitored target). <code>logs</code> and <code>ad_identifiers</code> are optional sections.",
      u:"https://docs.datadoghq.com/getting_started/integrations/"},
    {l:"M",q:"Which Linux command would you use to follow a log file as new lines are written?",
      o:["cat /var/log/datadog/agent.log","head /var/log/datadog/agent.log","tail -f /var/log/datadog/agent.log","ls /var/log/datadog/agent.log"], c:2,
      e:"<code>tail -f</code> streams new lines appended to a file. This is the standard way to follow agent.log during troubleshooting.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/"},
    {l:"M",q:"What is the role of DNS in network communication?",
      o:["Encrypts traffic between hosts","Resolves domain names to IP addresses","Provides load balancing","Authenticates users"], c:1,
      e:"DNS translates hostnames (e.g., app.datadoghq.com) to IP addresses. Agents must be able to resolve the Datadog intake endpoint to ship data.",
      u:"https://docs.datadoghq.com/agent/configuration/network/"},
    {l:"M",q:"Which metric type is BEST suited to represent the current value of free disk space on a host?",
      o:["Count","Gauge","Rate","Distribution"], c:1,
      e:"A gauge represents a value at a point in time. Free disk space is a snapshot value, so system.disk.free is a gauge.",
      u:"https://docs.datadoghq.com/metrics/types/"},
    {l:"M",q:"Which of these is NOT one of the three pillars of observability?",
      o:["Metrics","Logs","Traces","Tickets"], c:3,
      e:"The three pillars are metrics, logs, and traces. Tickets are an ITSM concept, not a telemetry type.",
      u:"https://docs.datadoghq.com/getting_started/"},
    {l:"M",q:"In <code>/etc/datadog-agent/datadog.yaml</code>, which YAML key sets the API key?",
      o:["api-key","apikey","api_key","key.api"], c:2,
      e:"The correct key is <code>api_key:</code> (snake_case). Datadog Agent config keys consistently use snake_case YAML.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-configuration-files/"},
    {l:"M",q:"What kind of storage offers persistent block-level access to data and is typical for OS disks?",
      o:["RAM","Object storage (e.g., S3)","Block storage (e.g., EBS volume)","CPU cache"], c:2,
      e:"Block storage (mounted as a disk) is the typical home for OS and database files. Object storage is for unstructured blobs; RAM is volatile.",
      u:"https://docs.datadoghq.com/integrations/system/"},
    {l:"M",q:"Which Python feature is commonly used to install third-party packages for Agent custom checks?",
      o:["yum","apt","pip","brew"], c:2,
      e:"Datadog ships its own embedded Python with the Agent. Use the Agent's bundled pip (e.g., <code>sudo -u dd-agent /opt/datadog-agent/embedded/bin/pip install ...</code>) for custom-check dependencies.",
      u:"https://docs.datadoghq.com/developers/write_agent_check/"},
    {l:"M",q:"Which file path is the canonical home for the main Datadog Agent config on a Linux host?",
      o:["/opt/datadog/datadog.yaml","/etc/datadog-agent/datadog.yaml","/var/log/datadog/datadog.yaml","/usr/local/datadog/agent.yaml"], c:1,
      e:"On Linux, the Agent's main configuration file is <code>/etc/datadog-agent/datadog.yaml</code>. Integration configs live under <code>/etc/datadog-agent/conf.d/</code>.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-configuration-files/"},
    {l:"M",q:"In a JSON payload, which value indicates a missing field?",
      o:["0","\"\"","null","undefined"], c:2,
      e:"In JSON, <code>null</code> represents an explicitly missing/empty value. JavaScript-style <code>undefined</code> is not part of JSON.",
      u:"https://docs.datadoghq.com/api/latest/"},
    {l:"M",q:"In a shell script, what does <code>#!/bin/bash</code> at the top of a file specify?",
      o:["A comment","An alias","The shebang: which interpreter executes the script","A YAML directive"], c:2,
      e:"The shebang line tells the OS which interpreter (here, /bin/bash) should run the script. Without it, the script is interpreted by the user's current shell.",
      u:"https://docs.datadoghq.com/integrations/"},
    {l:"M",q:"What is a 'host' in Datadog's data model?",
      o:["Any tagged resource","A unique billable entity reporting under a single hostname","Only physical servers","A single container"], c:1,
      e:"A Datadog 'host' is a uniquely identified compute entity (VM, bare-metal, or workload) reporting under one hostname. It is the basis of infrastructure billing for the Agent.",
      u:"https://docs.datadoghq.com/account_management/billing/pricing/"},
    {l:"M",q:"Which best describes 'horizontal scaling'?",
      o:["Adding more CPU/RAM to one machine","Adding more machines that share the load","Reducing instance count","Upgrading the OS"], c:1,
      e:"Horizontal scaling adds more instances (scale out). Vertical scaling adds resources to a single instance (scale up). Datadog's host map helps visualize horizontal fleets.",
      u:"https://docs.datadoghq.com/infrastructure/hostmap/"},
    {l:"M",q:"What is the role of port 22 by default?",
      o:["HTTP","HTTPS","SSH","SMTP"], c:2,
      e:"Port 22 is SSH (Secure Shell). It is the default channel administrators use to connect to Linux hosts to install or configure the Datadog Agent.",
      u:"https://docs.datadoghq.com/agent/configuration/network/"},
    {l:"M",q:"What kind of data is BEST represented as time-series?",
      o:["A user profile","A stack trace","CPU usage sampled every 10s","A configuration file"], c:2,
      e:"Time-series is a sequence of values with timestamps. CPU usage at regular intervals is the canonical example and how Datadog stores most infrastructure metrics.",
      u:"https://docs.datadoghq.com/metrics/"},
    {l:"M",q:"Which OS-level concept describes the amount of unused memory that the kernel can quickly reclaim?",
      o:["Resident set size","Available / cached memory","Swap utilization","Disk I/O wait"], c:1,
      e:"Cached/available memory (reclaimable buffers and page cache) can be released quickly when applications need RAM. Datadog reports <code>system.mem.usable</code> for this.",
      u:"https://docs.datadoghq.com/integrations/system/"},
    {l:"M",q:"Which file extension does the Datadog Agent use for integration YAML configs by default?",
      o:[".conf",".yml or .yaml",".json",".ini"], c:1,
      e:"Integration files live in <code>conf.d/&lt;integration&gt;.d/</code> with .yaml (or .yml) extensions; example files end in <code>.example</code>.",
      u:"https://docs.datadoghq.com/getting_started/integrations/"},
    {l:"M",q:"What is the function of an inode in a Linux filesystem?",
      o:["Stores the file's content","Stores filesystem metadata for a file (size, owner, blocks)","Acts as a network socket","Encrypts the file"], c:1,
      e:"An inode is the data structure that holds a file's metadata (size, permissions, owner, pointers to data blocks). Datadog's system check reports inode usage too.",
      u:"https://docs.datadoghq.com/integrations/system/"},
    {l:"M",q:"In a Python custom check, the class you implement extends which base class?",
      o:["AgentCheck","CheckBase","DDCheck","Monitor"], c:0,
      e:"Custom checks subclass <code>AgentCheck</code> from <code>datadog_checks.base</code>. The class implements a <code>check(self, instance)</code> method.",
      u:"https://docs.datadoghq.com/developers/write_agent_check/"},
    /* --- HARD (10) --- */
    {l:"H",q:"You configure <code>tags:</code> in <code>datadog.yaml</code> but a downstream integration also sets tags in its instance block. What is the resulting behavior?",
      o:["Only datadog.yaml tags apply","Only the integration's tags apply","Both sets of tags apply to the integration's metrics","An error is logged and tags are dropped"], c:2,
      e:"Datadog merges host-level tags (datadog.yaml) with check-level/instance tags. Both apply to the metrics produced by that integration instance.",
      u:"https://docs.datadoghq.com/getting_started/tagging/assigning_tags/"},
    {l:"H",q:"A YAML config has a value <code>password: 12345</code>. How is it parsed?",
      o:["String '12345'","Integer 12345","Boolean true","Null"], c:1,
      e:"YAML infers types. <code>12345</code> is an integer; for a literal string you must quote it: <code>password: \"12345\"</code>. Misinterpreted types are a common source of integration auth failures.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/yaml-parsing/"},
    {l:"H",q:"What is the practical implication of UDP being connectionless for DogStatsD?",
      o:["The Agent always retries failed sends","Metric submission is fire-and-forget; some packets may be lost under load","UDP guarantees ordered delivery","DogStatsD does not work over UDP"], c:1,
      e:"UDP has no delivery guarantee. DogStatsD favors low overhead — under high load packets can be dropped silently. Datadog provides Unix Domain Socket transport to mitigate this.",
      u:"https://docs.datadoghq.com/developers/dogstatsd/high_throughput/"},
    {l:"H",q:"Which is the BEST description of the OSI Layer 4?",
      o:["Physical signaling layer","Network routing layer (IP)","Transport layer (TCP/UDP) — segments, ports, flow control","Application layer (HTTP)"], c:2,
      e:"OSI Layer 4 is the transport layer where TCP and UDP operate. Ports (8125 for DogStatsD, 8126 for APM) are Layer-4 concepts.",
      u:"https://docs.datadoghq.com/agent/configuration/network/"},
    {l:"H",q:"In Python custom checks, what is the difference between <code>self.gauge()</code> and <code>self.count()</code>?",
      o:["gauge submits an absolute value at a point in time; count submits an increment over the interval","gauge is faster","count is for strings","No difference"], c:0,
      e:"<code>gauge</code> records a snapshot value; <code>count</code> accumulates an integer over the interval. Choosing the wrong one yields meaningless dashboards.",
      u:"https://docs.datadoghq.com/metrics/types/"},
    {l:"H",q:"Why does Datadog recommend immutable infrastructure tags (env, service, version) over user-defined free-form tags?",
      o:["They are required for the Agent to start","They drive Unified Service Tagging and correlation across metrics, traces, and logs","They reduce storage cost","Tags are otherwise dropped"], c:1,
      e:"env, service, and version are the three reserved tags that power Unified Service Tagging — the foundation of correlated observability across Datadog products.",
      u:"https://docs.datadoghq.com/getting_started/tagging/unified_service_tagging/"},
    {l:"H",q:"In a JSON file, which of the following is INVALID?",
      o:["{\"a\":1, \"b\":\"x\"}","[1,2,3]","{a:1}","{\"items\":[]}"], c:2,
      e:"JSON object keys MUST be double-quoted strings. <code>{a:1}</code> is valid JavaScript but invalid JSON. Datadog API payloads must be strict JSON.",
      u:"https://docs.datadoghq.com/api/latest/"},
    {l:"H",q:"Why is timestamp accuracy critical for observability data?",
      o:["For billing only","For correct ordering and correlation between metrics, logs, and traces","Datadog rewrites timestamps server-side","Timestamps don't matter"], c:1,
      e:"If host clocks drift, log/metric/trace correlation breaks and dashboards lie. Use NTP/chrony on every monitored host.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/"},
    {l:"H",q:"How does the Datadog Agent typically handle a network outage when shipping metrics to the intake?",
      o:["Drops all data immediately","Buffers data in memory (forwarder retry queue) and retries with backoff","Crashes","Switches to UDP automatically"], c:1,
      e:"The Agent's forwarder buffers payloads in memory and retries on failure with exponential backoff. Persistent buffer-to-disk is available on Agent 7+ for long outages.",
      u:"https://docs.datadoghq.com/agent/configuration/dual-shipping/"},
    {l:"H",q:"Which best describes an 'event' in Datadog?",
      o:["Any metric value","A discrete occurrence in time submitted to the event stream (e.g., deploy, alert, custom)","A monitor configuration","A dashboard widget"], c:1,
      e:"Events are discrete, time-stamped occurrences shown in the Events Explorer. They include deployments, monitor alerts, and custom-submitted events via API or DogStatsD.",
      u:"https://docs.datadoghq.com/events/"}
  ]},
  {id:"infra", name:"Infrastructure Development", icon:"\u25C6",
   blurb:"Agent install, API & application keys, running the Agent, hostnames.",
   questions: [
    /* --- EASY (15) --- */
    {l:"E",q:"What is the minimum credential required to install the Datadog Agent on a host?",
      o:["An application key","An API key","An Org admin password","A signed JWT"], c:1,
      e:"The Datadog Agent submits data using your organization's <b>API key</b>. Application keys are only required for some Datadog API endpoints.",
      u:"https://docs.datadoghq.com/account_management/api-app-keys/"},
    {l:"E",q:"On Linux, what is the typical Linux user that the Datadog Agent runs as?",
      o:["root","datadog","dd-agent","admin"], c:2,
      e:"The Linux package installer creates the <code>dd-agent</code> service user. The Agent runs as this user for security; integrations may need this user to have file/socket access.",
      u:"https://docs.datadoghq.com/agent/supported_platforms/linux/"},
    {l:"E",q:"Which command line tool is most commonly used to install the Datadog Agent on Linux via the official one-liner?",
      o:["wget","curl","scp","ssh"], c:1,
      e:"Datadog's documented install one-liner pipes the install script via curl: <code>DD_API_KEY=... bash -c \"$(curl -L https://install.datadoghq.com/scripts/install_script_agent7.sh)\"</code>",
      u:"https://app.datadoghq.com/account/settings/agent/latest"},
    {l:"E",q:"Which file holds the API key the Agent uses to authenticate with Datadog?",
      o:["/etc/datadog-agent/datadog.yaml","/etc/datadog-agent/api.key","/var/run/dd-agent.key","/opt/datadog/key"], c:0,
      e:"The <code>api_key:</code> setting in <code>/etc/datadog-agent/datadog.yaml</code> stores the API key.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-configuration-files/"},
    {l:"E",q:"On Linux, which systemd command starts the Datadog Agent service?",
      o:["service datadog start","sudo systemctl start datadog-agent","datadog-agent run --start","sudo agentctl start"], c:1,
      e:"<code>sudo systemctl start datadog-agent</code> starts the Agent service. <code>stop</code>, <code>restart</code>, and <code>status</code> are the other common subcommands.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"E",q:"By default, which user is automatically created by the Windows installer to run the Datadog Agent?",
      o:["ddagentuser","datadog","Administrator","SYSTEM"], c:0,
      e:"The Windows installer creates the <code>ddagentuser</code> local account by default. You can change it at install time.",
      u:"https://docs.datadoghq.com/agent/basic_agent_usage/windows/"},
    {l:"E",q:"What is the maximum number of API keys an organization can create in Datadog?",
      o:["10","50","100","Unlimited"], c:1,
      e:"Each Datadog organization can have at most 50 API keys and must keep at least one. Names must be unique.",
      u:"https://docs.datadoghq.com/account_management/api-app-keys/"},
    {l:"E",q:"Which file in Datadog Agent on Linux outputs runtime logs by default?",
      o:["/var/log/datadog/agent.log","/var/log/syslog","/etc/datadog-agent/agent.log","/tmp/dd.log"], c:0,
      e:"By default, the Agent writes logs to <code>/var/log/datadog/agent.log</code>. Other components (trace-agent, process-agent) also log under that directory.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/"},
    {l:"E",q:"True or false: an Application key alone is enough for the Agent to submit metrics.",
      o:["True","False"], c:1,
      e:"False. The Agent needs an <b>API key</b> to submit data. Application keys are used by users/applications calling the Datadog API.",
      u:"https://docs.datadoghq.com/account_management/api-app-keys/"},
    {l:"E",q:"Which environment variable is the conventional way to pass the API key to the Agent in containers?",
      o:["DD_KEY","DD_API_KEY","DATADOG_KEY","API_KEY"], c:1,
      e:"<code>DD_API_KEY</code> is the canonical environment variable read by the containerized Agent.",
      u:"https://docs.datadoghq.com/agent/guide/environment-variables/"},
    {l:"E",q:"What does the Datadog Agent's hostname identify?",
      o:["The Datadog org","The unique host the Agent is reporting from","The Agent version","The integration ID"], c:1,
      e:"The Agent hostname is the unique identifier for the host in Datadog. It must be stable and unique to avoid host collisions and duplicate billing.",
      u:"https://docs.datadoghq.com/agent/faq/how-datadog-agent-determines-the-hostname/"},
    {l:"E",q:"Which Agent version is the current major release line documented at Datadog?",
      o:["Agent 4","Agent 5","Agent 6","Agent 7"], c:3,
      e:"Agent 7 is the current major version. Agent 6 is still supported on legacy systems but new installs default to Agent 7 (Python 3).",
      u:"https://docs.datadoghq.com/agent/"},
    {l:"E",q:"True or false: a single API key is bound to a single host.",
      o:["True","False"], c:1,
      e:"False. An API key authenticates to a Datadog org and can be reused across many Agents/hosts. Application keys, however, are tied to a single user (or service account).",
      u:"https://docs.datadoghq.com/account_management/api-app-keys/"},
    {l:"E",q:"On macOS, where does the Datadog Agent application typically install?",
      o:["/usr/local/datadog","/opt/datadog-agent","/Applications/Datadog Agent.app","~/.datadog-agent"], c:2,
      e:"On macOS, the Agent installs as the <i>Datadog Agent</i> app under /Applications. CLI tooling is available via <code>datadog-agent</code> launched from that app's bundle.",
      u:"https://docs.datadoghq.com/agent/basic_agent_usage/osx/"},
    {l:"E",q:"What is the canonical name of the Agent's main configuration directory on Linux?",
      o:["/opt/datadog","/etc/datadog","/etc/datadog-agent","/var/datadog"], c:2,
      e:"<code>/etc/datadog-agent</code> contains datadog.yaml, conf.d/, checks.d/, and auth_token. Integration configs live under conf.d/&lt;name&gt;.d/.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-configuration-files/"},
    /* --- MEDIUM (25) --- */
    {l:"M",q:"What is the BEST description of the relationship between an API key and an Application key?",
      o:["They are interchangeable","API keys authenticate the source of data (org); Application keys authorize API actions on behalf of a user","API keys are public; Application keys are private","Both must rotate every 24 hours"], c:1,
      e:"API key = identifies the org submitting data. Application key = identifies the user/service account taking actions via the API. Many endpoints require BOTH headers.",
      u:"https://docs.datadoghq.com/account_management/api-app-keys/"},
    {l:"M",q:"Which header names are sent when authenticating to most Datadog API endpoints?",
      o:["X-API-Key and X-App-Key","DD-API-KEY and DD-APPLICATION-KEY","Authorization-API and Authorization-App","DATADOG-API and DATADOG-APP"], c:1,
      e:"Datadog uses <code>DD-API-KEY</code> and (when required) <code>DD-APPLICATION-KEY</code> headers for API authentication.",
      u:"https://docs.datadoghq.com/api/latest/authentication/"},
    {l:"M",q:"You install the Agent on a cloud VM but the host appears in the Datadog UI with the wrong hostname. Which configuration MOST directly fixes this?",
      o:["Restart the Agent","Set <code>hostname:</code> in datadog.yaml","Update DNS","Clear the browser cache"], c:1,
      e:"Setting <code>hostname:</code> explicitly in datadog.yaml overrides the auto-detected hostname. After restart the Agent reports under that name.",
      u:"https://docs.datadoghq.com/agent/faq/how-datadog-agent-determines-the-hostname/"},
    {l:"M",q:"By default, what is the order of precedence for how the Agent picks a hostname (highest first)?",
      o:["OS hostname → datadog.yaml → cloud metadata","datadog.yaml → cloud provider metadata → OS hostname","Random UUID → datadog.yaml → OS","OS hostname only"], c:1,
      e:"datadog.yaml's <code>hostname</code> setting is highest priority. If unset, the Agent uses cloud-provider metadata (AWS instance-id, GCE name, Azure name) and falls back to the OS hostname.",
      u:"https://docs.datadoghq.com/agent/faq/how-datadog-agent-determines-the-hostname/"},
    {l:"M",q:"Which command on Linux confirms the Datadog Agent's current health and integrations status?",
      o:["datadog-agent info","sudo datadog-agent status","systemctl logs datadog-agent","dd-info"], c:1,
      e:"<code>sudo datadog-agent status</code> shows running checks, last-collection times, forwarder transactions, and any errors. Critical for live troubleshooting.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"M",q:"You rotate an API key. What happens to Agents still using the old key?",
      o:["They keep working forever","Their submissions are rejected once the key is deleted","Datadog migrates them automatically","Only the UI is affected"], c:1,
      e:"API keys are independent. Once you delete a key, any Agent still holding it gets HTTP 403/401 on submission. Best practice: roll the new key out before deleting the old one.",
      u:"https://docs.datadoghq.com/account_management/api-app-keys/"},
    {l:"M",q:"In a Kubernetes deployment using the Datadog Operator, where do you typically place the API key?",
      o:["A ConfigMap","A Kubernetes Secret referenced from the DatadogAgent CR","A plain env var in the manifest","The Agent's container image"], c:1,
      e:"Best practice is to create a Kubernetes Secret holding the API key and reference it from the DatadogAgent custom resource (e.g., <code>credentials.apiSecret</code>).",
      u:"https://docs.datadoghq.com/containers/kubernetes/installation/"},
    {l:"M",q:"On Windows, which CLI binary is used to control the Agent (e.g., status, restart)?",
      o:["dd-agent.exe","datadog.exe","agent.exe","ddagentctl.exe"], c:2,
      e:"On Windows, <code>agent.exe</code> (installed under <code>C:\\Program Files\\Datadog\\Datadog Agent\\bin\\</code>) provides the CLI: <code>agent.exe status</code>, <code>agent.exe restart</code>, etc.",
      u:"https://docs.datadoghq.com/agent/basic_agent_usage/windows/"},
    {l:"M",q:"Which Agent version introduced support for Python 3?",
      o:["Agent 5","Agent 6","Agent 7","Agent 8"], c:2,
      e:"Agent 7 ships with Python 3 only. Agent 6 still supports Python 2 (legacy custom checks).",
      u:"https://docs.datadoghq.com/agent/"},
    {l:"M",q:"Which is a valid way to install the Agent on a Docker host with one command?",
      o:["<code>docker run -d --name dd-agent -e DD_API_KEY=&lt;KEY&gt; -e DD_SITE=datadoghq.com gcr.io/datadoghq/agent:7</code>","<code>docker pull datadog</code>","<code>docker compose datadog-agent up</code>","Datadog Agent doesn't run in Docker"], c:0,
      e:"The documented docker run uses <code>gcr.io/datadoghq/agent:7</code> with <code>DD_API_KEY</code> and <code>DD_SITE</code>. Volume mounts (/var/run/docker.sock, /proc, /sys/fs/cgroup) are typically added for full host visibility.",
      u:"https://docs.datadoghq.com/containers/docker/"},
    {l:"M",q:"Which env var sets the Datadog site (region) the Agent ships to?",
      o:["DD_REGION","DD_SITE","DD_ENDPOINT","DD_DC"], c:1,
      e:"<code>DD_SITE</code> selects the intake (e.g., datadoghq.com for US1, datadoghq.eu for EU1, us3.datadoghq.com, us5.datadoghq.com, ap1.datadoghq.com). Wrong site = silent data loss.",
      u:"https://docs.datadoghq.com/getting_started/site/"},
    {l:"M",q:"Where do you find the API key in the Datadog UI?",
      o:["Profile → Preferences","Organization Settings → API Keys","Agent → Logs","Monitors → API"], c:1,
      e:"API keys are managed under <i>Organization Settings → API Keys</i>. Application keys live under <i>Personal API/App keys</i> (per user).",
      u:"https://docs.datadoghq.com/account_management/api-app-keys/"},
    {l:"M",q:"When does the Agent require a restart after configuration changes?",
      o:["Never — it is fully hot-reloading","After any change to datadog.yaml; for integration configs the Agent auto-reloads conf.d/ files","Only after a kernel update","Only when changing the host's IP"], c:1,
      e:"Changes to <code>datadog.yaml</code> require a restart. Integration files under <code>conf.d/</code> are picked up automatically by Autodiscovery / config-watcher.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"M",q:"Which is NOT a valid Agent installation method?",
      o:["Linux package (deb/rpm)","Docker container","Kubernetes via Helm or Operator","ARM-only mobile app"], c:3,
      e:"Datadog ships Linux packages, macOS app, Windows MSI, Docker images, Helm charts, the Datadog Operator, and Chef/Puppet/Ansible modules. There is no mobile install path.",
      u:"https://docs.datadoghq.com/agent/"},
    {l:"M",q:"Which command rotates an API key (admin task)?",
      o:["<code>datadog-agent rotate-key</code>","Use the Datadog UI under Organization Settings → API Keys → New Key","<code>curl -X PUT /api/v1/key/rotate</code>","kubectl rotate-secret"], c:1,
      e:"API keys are created and revoked from the Org Settings page in the UI (or via the API). The Agent CLI does not rotate keys.",
      u:"https://docs.datadoghq.com/account_management/api-app-keys/"},
    {l:"M",q:"On a Linux host with cloud-init, the Datadog Agent install script is invoked at boot. Where should the API key be stored to avoid leaking it?",
      o:["In cloud-init's plain user-data","In a secrets manager and injected at runtime as DD_API_KEY","In the Git repo","In /tmp"], c:1,
      e:"Treat API keys as secrets. Use a secrets manager (AWS Secrets Manager, GCP Secret Manager, Vault) and inject DD_API_KEY at runtime.",
      u:"https://docs.datadoghq.com/agent/guide/secrets-management/"},
    {l:"M",q:"What is the function of the <code>datadog-agent flare</code> command?",
      o:["Sends test metrics","Bundles Agent logs, configs, and diagnostic info into an encrypted archive for Support","Restarts the Agent","Rotates the API key"], c:1,
      e:"<code>sudo datadog-agent flare &lt;CASE_ID&gt;</code> packages diagnostics and sends them to Datadog Support (or saves locally). Standard first step for any support ticket.",
      u:"https://docs.datadoghq.com/agent/troubleshooting/send_a_flare/"},
    {l:"M",q:"Why might two hosts appear under the same hostname in Datadog?",
      o:["Both hosts have the same auto-detected hostname (e.g., 'localhost' or duplicated OS name)","Datadog merges hosts arbitrarily","API key is shared","DNS is broken"], c:0,
      e:"Hostname collisions occur when two hosts present the same name. Force unique values via <code>hostname:</code> in datadog.yaml or rely on cloud-provider instance IDs.",
      u:"https://docs.datadoghq.com/agent/faq/how-datadog-agent-determines-the-hostname/"},
    {l:"M",q:"What is the typical default install path for the Agent on Linux?",
      o:["/usr/bin/dd","/opt/datadog-agent","/var/datadog","/srv/dd"], c:1,
      e:"On Linux, binaries and bundled Python live under <code>/opt/datadog-agent/</code>; config under <code>/etc/datadog-agent/</code>.",
      u:"https://docs.datadoghq.com/agent/supported_platforms/linux/"},
    {l:"M",q:"True or false: you should commit your Datadog API key to version control as long as the repo is private.",
      o:["True","False"], c:1,
      e:"Never commit secrets, even to private repos. Use environment variables or a secrets manager. If leaked, revoke the key immediately in Org Settings.",
      u:"https://docs.datadoghq.com/account_management/api-app-keys/"},
    {l:"M",q:"In containers, what is the recommended way to make the host's OS hostname visible to the Agent?",
      o:["Hardcode it in datadog.yaml","Mount /proc and /etc/hostname into the container","Use DNS","Use the container ID"], c:1,
      e:"Mounting <code>/proc</code>, <code>/etc/hostname</code> (and <code>/etc/os-release</code>) gives the containerized Agent access to host metadata, including the hostname.",
      u:"https://docs.datadoghq.com/containers/docker/"},
    {l:"M",q:"Which is true of the Datadog Cluster Agent in Kubernetes?",
      o:["It replaces every node Agent","It deploys as a single (or HA) pod and reduces API-server load by acting as a proxy for cluster-level data","It runs as a DaemonSet alongside node Agents","It is the only component that needs an API key"], c:1,
      e:"The Cluster Agent runs as a Deployment (1+ replicas). Node-level Datadog Agents talk to it for cluster-scoped data (kube-state-metrics, autodiscovery), reducing API-server load and exposing cluster checks.",
      u:"https://docs.datadoghq.com/containers/cluster_agent/setup/"},
    {l:"M",q:"On Linux, which package signs Datadog Agent packages?",
      o:["GPG keys published by Datadog","Self-signed certificates","No signing","Microsoft Authenticode"], c:0,
      e:"Datadog signs Linux packages with GPG keys (rotated periodically). The install script imports the right public keys before running apt/yum.",
      u:"https://docs.datadoghq.com/agent/linux_packages/"},
    {l:"M",q:"You install the Agent via Helm in Kubernetes. Which Helm value sets the API key from a pre-existing secret?",
      o:["datadog.apiKey","datadog.apiKeyExistingSecret","apikey","secrets.dd"], c:1,
      e:"In the Datadog Helm chart, <code>datadog.apiKeyExistingSecret</code> references a secret already in the cluster. <code>datadog.apiKey</code> sets it inline (not recommended).",
      u:"https://docs.datadoghq.com/containers/kubernetes/installation/?tab=helm"},
    {l:"M",q:"What does the Agent's auth_token (under /etc/datadog-agent/auth_token) protect?",
      o:["The Datadog API","The local IPC API used by the Agent's components (CLI talks to running agent)","SSH access","Docker socket"], c:1,
      e:"The auth_token authorizes local IPC between Agent components and the CLI. Without it, <code>datadog-agent status</code> can't reach the running daemon.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    /* --- HARD (10) --- */
    {l:"H",q:"A host shows up twice in the Datadog Infrastructure List with very similar hostnames (one with .local, one without). Which is the MOST LIKELY root cause?",
      o:["Two API keys","The Agent's hostname source differs (cloud metadata vs OS) and the host is reporting under two names","Datadog billing bug","DNS poisoning"], c:1,
      e:"If <code>hostname:</code> is not explicitly set, the Agent may report under different names from different sources at different times. Pin the hostname in datadog.yaml or use the cloud-provider canonical hostname.",
      u:"https://docs.datadoghq.com/agent/faq/how-datadog-agent-determines-the-hostname/"},
    {l:"H",q:"In a Docker run command, you mount <code>/var/run/docker.sock</code> read-only into the Agent container. What capability does this provide?",
      o:["Lets the Agent control containers","Lets the Agent enumerate running containers, fetch labels, and apply Autodiscovery","Disables logs","Lets the Agent run as root"], c:1,
      e:"The Agent reads the Docker socket to discover running containers and apply Autodiscovery integration templates. Read-only mount is sufficient and safer.",
      u:"https://docs.datadoghq.com/containers/docker/"},
    {l:"H",q:"Which is TRUE about Application keys in Datadog?",
      o:["They are organization-wide","They are tied to a specific user or service account and inherit their permissions/scopes","They never expire","They are required for the Agent"], c:1,
      e:"App keys are user/service-account scoped, inherit the owner's permissions, and can be further restricted with authorization scopes. Without them, many write APIs are unavailable.",
      u:"https://docs.datadoghq.com/account_management/api-app-keys/"},
    {l:"H",q:"In a multi-org enterprise setup, what is the correct strategy for shipping data from one host to multiple organizations?",
      o:["Run a single Agent and rotate API keys","Run multiple Agents with different API keys (each pointing to a different org/site)","Use Dual Shipping configuration in datadog.yaml to send to additional endpoints","Both B and C are valid"], c:3,
      e:"Both approaches work. Dual Shipping (in datadog.yaml) lets a single Agent fan out copies of metrics/logs to a second intake, useful for migrations and multi-org reporting.",
      u:"https://docs.datadoghq.com/agent/configuration/dual-shipping/"},
    {l:"H",q:"You set <code>DD_HOSTNAME</code> via the container env var AND configure <code>hostname:</code> in datadog.yaml mounted into the container. Which wins?",
      o:["datadog.yaml always wins","DD_HOSTNAME env var (env vars take precedence over file config)","Whichever is alphabetically first","Both, leading to duplicate reporting"], c:1,
      e:"Environment variables override values from datadog.yaml. <code>DD_HOSTNAME</code> wins in this case.",
      u:"https://docs.datadoghq.com/agent/guide/environment-variables/"},
    {l:"H",q:"Why is it generally a bad idea to share a single application key across many services or pipelines?",
      o:["Performance impact","If leaked, all callers must rotate simultaneously; you lose audit attribution","Datadog blocks shared keys","No reason"], c:1,
      e:"Per-pipeline app keys (or service-account keys with scopes) give you blast-radius containment and clean audit trails when investigating misuse.",
      u:"https://docs.datadoghq.com/account_management/api-app-keys/"},
    {l:"H",q:"You install the Agent on an EC2 instance behind a strict outbound firewall. What is the MINIMAL set of egress rules needed for full metric + log + trace shipping (US1)?",
      o:["Only port 80","TCP 443 to api.datadoghq.com plus the documented intake endpoints/ports for each product","UDP 8125 outbound","TCP 22 outbound"], c:1,
      e:"At minimum allow TCP 443 to <code>api.datadoghq.com</code> and the documented per-product intake endpoints (e.g., http-intake.logs.datadoghq.com, trace.agent.datadoghq.com). See Network Traffic doc for the full list.",
      u:"https://docs.datadoghq.com/agent/configuration/network/"},
    {l:"H",q:"In Datadog Operator, what is the role of the DatadogAgent custom resource?",
      o:["Declarative spec describing the desired state of Agent + Cluster Agent + Cluster Check Runner in the cluster","A namespace selector","A Helm chart","A workload monitor"], c:0,
      e:"The DatadogAgent CR is the operator's reconciliation target: it spec's images, features (APM, logs, NPM), credentials secrets, and node selectors for all Agent components.",
      u:"https://docs.datadoghq.com/containers/kubernetes/installation/?tab=operator"},
    {l:"H",q:"A team rotates their API key without staging the new one. What is the immediate consequence?",
      o:["All Agents and integrations using the old key stop sending data immediately","Data is buffered for 24 hours","Nothing","Datadog auto-migrates Agents"], c:0,
      e:"Once the old key is deleted, every Agent still using it gets 403/401 and data is dropped (after retry buffer drains). Always deploy the new key first, then delete the old.",
      u:"https://docs.datadoghq.com/account_management/api-app-keys/"},
    {l:"H",q:"Which statement about the Datadog Agent's hostname is MOST accurate?",
      o:["It must be the FQDN","It must be the OS hostname","It is what Datadog uses to deduplicate hosts and join data; it must be unique and stable","Hostname changes are ignored"], c:2,
      e:"Hostname is Datadog's primary host identity. Instability (e.g., DHCP changing it every reboot) creates phantom hosts and broken dashboards.",
      u:"https://docs.datadoghq.com/agent/faq/how-datadog-agent-determines-the-hostname/"}
  ]},
  {id:"network", name:"Networking & Agent Config", icon:"\u25B2",
   blurb:"Datadog ports, IP addresses, Autodiscovery.",
   questions: [
    /* --- EASY (15) --- */
    {l:"E",q:"What is the default port the Datadog Agent listens on for DogStatsD over UDP?",
      o:["8123","8125","8126","8127"], c:1,
      e:"DogStatsD listens on UDP <b>8125</b> by default. Change with <code>dogstatsd_port:</code> in datadog.yaml.",
      u:"https://docs.datadoghq.com/developers/dogstatsd/"},
    {l:"E",q:"What is the default port the Datadog APM trace receiver listens on?",
      o:["8125 UDP","8126 TCP","443 TCP","9092 TCP"], c:1,
      e:"The trace-agent receives traces on TCP <b>8126</b> by default (<code>apm_config.receiver_port</code>).",
      u:"https://docs.datadoghq.com/tracing/setup/"},
    {l:"E",q:"To which port does the Datadog Agent ship most outbound data (metrics, events, service checks)?",
      o:["TCP 80","TCP 443","UDP 8125","TCP 8126"], c:1,
      e:"Outbound metric/event traffic goes over HTTPS on TCP <b>443</b> to api.&lt;site&gt;.",
      u:"https://docs.datadoghq.com/agent/configuration/network/"},
    {l:"E",q:"Where does Datadog publish the list of IP ranges its services use?",
      o:["A monthly email","A static doc page","The /api/v1/ip_ranges endpoint at ip-ranges.datadoghq.com","Inside the Agent log"], c:2,
      e:"Datadog publishes its IP ranges programmatically at <code>https://ip-ranges.datadoghq.com</code> (per site/region) so firewall rules can be kept up to date.",
      u:"https://docs.datadoghq.com/agent/configuration/network/"},
    {l:"E",q:"Which protocol does the DogStatsD default port (8125) use?",
      o:["TCP","UDP","HTTP","gRPC"], c:1,
      e:"DogStatsD uses UDP for low-overhead metric submission. A Unix domain socket option also exists for higher throughput / no port.",
      u:"https://docs.datadoghq.com/developers/dogstatsd/"},
    {l:"E",q:"Which technology lets the Datadog Agent automatically detect new containerized services and apply integration configs?",
      o:["Auto-Provisioning","Autodiscovery","Auto-Inject","Self-Discovery"], c:1,
      e:"Autodiscovery (AD) watches container/orchestrator events and matches integration templates by image, label, or annotation.",
      u:"https://docs.datadoghq.com/getting_started/containers/autodiscovery/"},
    {l:"E",q:"True or false: the Agent must reach the Datadog intake over SSL/TLS.",
      o:["True","False"], c:0,
      e:"All Agent traffic to Datadog is sent over TLS (HTTPS).",
      u:"https://docs.datadoghq.com/agent/configuration/network/"},
    {l:"E",q:"In Kubernetes, which mechanism is the recommended way to provide Autodiscovery templates to the Agent?",
      o:["Hand-edit conf.d files in the container","Pod annotations like <code>ad.datadoghq.com/&lt;container&gt;.check_names</code>","Mount /tmp into the Agent","DNS records"], c:1,
      e:"Pod annotations (or service annotations for endpoint checks) are the canonical way. The Agent reads them via the Kubernetes API.",
      u:"https://docs.datadoghq.com/containers/kubernetes/integrations/"},
    {l:"E",q:"What is the role of the trace-agent within the Datadog Agent suite?",
      o:["Sends logs","Receives application traces and ships them to Datadog APM","Replaces the main Agent","Runs synthetic tests"], c:1,
      e:"The trace-agent listens on 8126, batches/samples traces, and ships them to Datadog APM.",
      u:"https://docs.datadoghq.com/tracing/"},
    {l:"E",q:"Which port does the Agent's process-agent expose by default? (Tip: it does not require an inbound port.)",
      o:["8125","8126","No inbound port — process-agent only ships data outbound","6062"], c:2,
      e:"Process Agent runs in-process and pushes data outbound. It has no inbound listener; an internal debug expvar endpoint may be enabled.",
      u:"https://docs.datadoghq.com/infrastructure/process/"},
    {l:"E",q:"True or false: Datadog IP ranges are static.",
      o:["True","False"], c:1,
      e:"Datadog IPs change over time and per site. Always pull from <code>https://ip-ranges.datadoghq.com</code> rather than hardcoding.",
      u:"https://docs.datadoghq.com/agent/configuration/network/"},
    {l:"E",q:"Which is a valid DogStatsD transport on Linux that bypasses UDP entirely?",
      o:["Named pipes","Unix Domain Socket (UDS)","SMB","NFS"], c:1,
      e:"DogStatsD over UDS removes UDP packet-loss risk and adds container origin detection. Configured via <code>dogstatsd_socket</code> in datadog.yaml.",
      u:"https://docs.datadoghq.com/developers/dogstatsd/unix_socket/"},
    {l:"E",q:"What is the function of <code>ad_identifiers</code> in an integration YAML file?",
      o:["Sets the API key","Lists images or labels that identify which containers this template should match for Autodiscovery","Defines the port","Tags the host"], c:1,
      e:"<code>ad_identifiers</code> tells Autodiscovery which containers this template applies to (by image name, container name, or label).",
      u:"https://docs.datadoghq.com/containers/guide/ad_identifiers/"},
    {l:"E",q:"What does %%host%% resolve to in an Autodiscovery template?",
      o:["The Agent's hostname","The IP of the discovered container","The Datadog endpoint","Localhost only"], c:1,
      e:"<code>%%host%%</code> is a template variable populated with the discovered container's IP at runtime.",
      u:"https://docs.datadoghq.com/containers/guide/template_variables/"},
    {l:"E",q:"Which DogStatsD aggregation interval is the default?",
      o:["1 second","5 seconds","10 seconds","60 seconds"], c:2,
      e:"DogStatsD aggregates incoming metrics in a flush interval of 10 seconds by default before sending to the intake.",
      u:"https://docs.datadoghq.com/developers/dogstatsd/"},
    /* --- MEDIUM (25) --- */
    {l:"M",q:"You want to expose DogStatsD on UDP from a sidecar container to the Agent DaemonSet on Kubernetes. Which is the MOST common pattern?",
      o:["Use the host network and 127.0.0.1:8125","Mount the Unix Domain Socket via hostPath and send via UDS","Use a Kubernetes Service","Both A and B are valid; UDS is recommended for accurate origin detection"], c:3,
      e:"Both work. UDS (over a hostPath) is preferred: no UDP loss, plus the Agent can identify the originating container for tagging.",
      u:"https://docs.datadoghq.com/developers/dogstatsd/unix_socket/"},
    {l:"M",q:"Which port does the Agent's IPC API listen on for local CLI traffic by default?",
      o:["5001","5050","5002","5004 (cmd_port)"], c:3,
      e:"The Agent CLI talks to the running daemon on <code>cmd_port</code> (default 5001 on Agent 7; check Agent docs). Setting it incorrectly breaks <code>datadog-agent status</code>.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-commands/"},
    {l:"M",q:"Which port does the trace-agent expose for non-Linux UDS submission?",
      o:["TCP 8126","UDP 8125","TCP 8127","TCP 8128"], c:0,
      e:"The trace-agent listens on TCP 8126 by default. On Linux you can also use a UDS at /var/run/datadog/apm.socket.",
      u:"https://docs.datadoghq.com/tracing/setup/"},
    {l:"M",q:"You want to harden a host so it can ONLY reach Datadog. Where do you get the up-to-date list of CIDRs to allowlist?",
      o:["docs.datadoghq.com only","ip-ranges.datadoghq.com (JSON endpoint, filtered by site and service)","Public AWS ranges","Hardcode the values from a community list"], c:1,
      e:"Pull from <code>https://ip-ranges.datadoghq.com</code>. The JSON groups CIDRs by service (api, logs, agents, etc.) and is updated as ranges change.",
      u:"https://docs.datadoghq.com/agent/configuration/network/"},
    {l:"M",q:"True or false: changing <code>dogstatsd_port</code> requires no Agent restart.",
      o:["True","False"], c:1,
      e:"False. Changes to datadog.yaml (including dogstatsd_port) require an Agent restart.",
      u:"https://docs.datadoghq.com/developers/dogstatsd/"},
    {l:"M",q:"In Docker, which env var enables Autodiscovery on the Agent?",
      o:["DD_AD","DD_AUTODISCOVERY","Agent enables AD by default when running with container access","DD_DISCOVER"], c:2,
      e:"When the Agent runs with access to the container runtime (Docker socket, kubelet) it auto-discovers containers and applies templates. Specific listeners (<code>listeners:</code> in datadog.yaml) can be tuned.",
      u:"https://docs.datadoghq.com/containers/docker/"},
    {l:"M",q:"Which is the BEST description of an Autodiscovery 'integration template'?",
      o:["A static YAML file applied to every host","A YAML doc with placeholders (e.g., %%host%%, %%port%%) that the Agent applies when matching containers appear","A Helm chart","A monitor"], c:1,
      e:"Templates declare instance/init_config sections with template variables. Datadog ships auto-conf templates for common services (Redis, Postgres) and users can add their own.",
      u:"https://docs.datadoghq.com/containers/guide/autodiscovery-examples/"},
    {l:"M",q:"Where would you place an Autodiscovery template for an integration without modifying a container image?",
      o:["Kubernetes pod annotations","Datadog Agent's <code>conf.d/&lt;integration&gt;.d/auto_conf.yaml</code>","ConfigMap mounted into the Agent","All of the above are valid"], c:3,
      e:"AD templates can come from pod annotations, Docker labels, the Agent's conf.d directory, ConfigMaps, or key-value stores. Choose by ergonomics for your platform.",
      u:"https://docs.datadoghq.com/containers/guide/auto_conf/"},
    {l:"M",q:"Which annotation key prefix is used for AD v2 in Kubernetes?",
      o:["service.dd/","autodiscover.k8s/","ad.datadoghq.com/&lt;container_name&gt;.*","datadog.io/"], c:2,
      e:"Annotations follow <code>ad.datadoghq.com/&lt;container_name&gt;.check_names</code>, <code>.init_configs</code>, <code>.instances</code>, and <code>.logs</code>.",
      u:"https://docs.datadoghq.com/containers/kubernetes/integrations/"},
    {l:"M",q:"What is the function of the Cluster Check Runner?",
      o:["Runs node-level integrations only","Runs 'cluster checks' (single-instance checks like external endpoints) and distributes them across runners to balance load","Replaces the API server","Caches logs"], c:1,
      e:"The Cluster Check Runner is a Deployment that hosts cluster-scoped checks (e.g., an external HTTP endpoint) so they run once for the cluster — and scales for HA.",
      u:"https://docs.datadoghq.com/containers/cluster_agent/clusterchecks/"},
    {l:"M",q:"Which file controls listener and provider configuration for Autodiscovery in Agent 7?",
      o:["/etc/datadog-agent/datadog.yaml under <code>listeners</code> and <code>config_providers</code>","ad.yaml","listeners.conf","auto.yaml"], c:0,
      e:"<code>listeners:</code> (e.g., docker, kubelet) and <code>config_providers:</code> (e.g., kubernetes, docker) live in datadog.yaml.",
      u:"https://docs.datadoghq.com/agent/configuration/agent-configuration-files/"},
    {l:"M",q:"Why does Datadog recommend opening egress to api.&lt;site&gt;, http-intake.logs.&lt;site&gt;, trace.agent.&lt;site&gt;, etc. instead of just one host?",
      o:["For redundancy only","Different products have different intake endpoints; opening all required prevents silent data loss","To distribute load fairly","No specific reason"], c:1,
      e:"Metrics, logs, traces, NPM, and database monitoring each have distinct intake hostnames. Block any of them and that product silently stops receiving data.",
      u:"https://docs.datadoghq.com/agent/configuration/network/"},
    {l:"M",q:"Which transport is BEST for high-throughput DogStatsD on a single host?",
      o:["UDP","Unix Domain Socket","TCP","HTTP"], c:1,
      e:"UDS avoids UDP loss under load and packet-size limits. Datadog's high-throughput guide explicitly recommends UDS for heavy custom-metric workloads.",
      u:"https://docs.datadoghq.com/developers/dogstatsd/high_throughput/"},
    {l:"M",q:"Which is true about the Datadog APM intake hostname?",
      o:["It is always api.datadoghq.com","It is per-site (e.g., trace.agent.datadoghq.com for US1, trace.agent.eu.datadoghq.com for EU1)","Only one global endpoint","DNS-load-balanced by the Agent"], c:1,
      e:"APM has a site-specific intake hostname. The Agent picks it based on <code>DD_SITE</code>/<code>site</code> in datadog.yaml.",
      u:"https://docs.datadoghq.com/getting_started/site/"},
    {l:"M",q:"You see this in a Pod annotation: <code>ad.datadoghq.com/redis.check_names: '[\"redisdb\"]'</code>. What does it tell the Agent?",
      o:["Treat the container named 'redis' as a Redis instance and run the 'redisdb' integration on it","Restart Redis","Create a monitor","Disable Redis"], c:0,
      e:"The annotation maps the container 'redis' to the Datadog 'redisdb' integration. <code>init_configs</code> and <code>instances</code> follow.",
      u:"https://docs.datadoghq.com/containers/kubernetes/integrations/"},
    {l:"M",q:"Which port is used by the Datadog Cluster Agent's external metrics provider on Kubernetes by default?",
      o:["443","8125","5005","8443 (HTTPS for the external metrics API)"], c:3,
      e:"The Cluster Agent serves the external metrics provider over HTTPS (port 8443 by default) so HPAs can scale on Datadog metrics.",
      u:"https://docs.datadoghq.com/containers/cluster_agent/external_metrics/"},
    {l:"M",q:"True or false: opening only UDP 8125 inbound on the host is enough for the Agent to ship data to Datadog.",
      o:["True","False"], c:1,
      e:"False. UDP 8125 is inbound for DogStatsD on the host. The Agent ships OUTBOUND on TCP 443 to Datadog intakes — that's the firewall rule that matters.",
      u:"https://docs.datadoghq.com/agent/configuration/network/"},
    {l:"M",q:"Which Agent process listens for Log payloads when log collection is enabled?",
      o:["logs-agent (a subprocess started by the main Agent)","trace-agent","process-agent","No process — logs use UDP 8125"], c:0,
      e:"The main Agent spawns a logs-agent component when <code>logs_enabled: true</code>. It tails files / receives via TCP/UDP and ships to the log intake on TLS-encrypted TCP.",
      u:"https://docs.datadoghq.com/agent/logs/"},
    {l:"M",q:"Which is true about the Datadog Agent's TCP log intake endpoint for US1?",
      o:["agent-intake.logs.datadoghq.com:10516 (TLS-encrypted TCP)","logs.datadoghq.com:80 (plain HTTP)","UDP 514","No TCP intake exists"], c:0,
      e:"For US1, Agent ships logs over TLS-encrypted TCP to <code>agent-intake.logs.datadoghq.com:10516</code>. HTTPS (port 443) is also supported for HTTP transport.",
      u:"https://docs.datadoghq.com/agent/logs/log_transport/"},
    {l:"M",q:"On EU1 (Datadog EU site), which is the default log transport port over HTTPS?",
      o:["10516","443","80","8125"], c:1,
      e:"For EU1, logs go over HTTPS on port 443 by default. Use TLS-TCP on 443 if HTTP intake isn't available.",
      u:"https://docs.datadoghq.com/agent/logs/log_transport/"},
    {l:"M",q:"What is the role of the <code>kubelet</code> listener in Autodiscovery?",
      o:["Forwards logs","Connects to the kubelet API on each node to enumerate pods/containers and read annotations","Replaces kube-state-metrics","Runs as a sidecar"], c:1,
      e:"The kubelet listener queries the local kubelet to discover containers on the node and read AD annotations.",
      u:"https://docs.datadoghq.com/containers/kubernetes/integrations/"},
    {l:"M",q:"True or false: %%env_MY_VAR%% in an AD template reads MY_VAR from the discovered container's environment.",
      o:["True","False"], c:1,
      e:"False. <code>%%env_MY_VAR%%</code> resolves to MY_VAR <b>as seen by the Agent process</b> (not the discovered container). Use other AD template variables for container-scoped values.",
      u:"https://docs.datadoghq.com/containers/guide/template_variables/"},
    {l:"M",q:"Which CIDR-related field does the Datadog ip-ranges endpoint return per service?",
      o:["Only IPv4","Only IPv6","Both IPv4 and IPv6 prefixes","DNS names"], c:2,
      e:"The endpoint returns both IPv4 (<code>prefixes_ipv4</code>) and IPv6 (<code>prefixes_ipv6</code>) prefixes per service per site.",
      u:"https://docs.datadoghq.com/agent/configuration/network/"},
    {l:"M",q:"Which is the BEST way to handle DogStatsD container origin detection on Kubernetes?",
      o:["Hardcode the host","Use UDS with the Agent's origin-detection feature so submitted metrics inherit the container's tags","DNS-based","Manual sidecar"], c:1,
      e:"With UDS + origin detection, the Agent identifies which container sent each datagram and applies env/service/version + pod tags automatically.",
      u:"https://docs.datadoghq.com/developers/dogstatsd/unix_socket/"},
    {l:"M",q:"What is the role of the <code>config_providers</code> setting in datadog.yaml?",
      o:["Lists alert thresholds","Lists where to read AD templates from (docker, kubernetes, file)","Defines Agent install dir","Sets the API key"], c:1,
      e:"<code>config_providers</code> tells Autodiscovery where to look for templates (e.g., docker labels, kubernetes annotations, etcd, consul, file).",
      u:"https://docs.datadoghq.com/containers/guide/auto_conf/"},
    /* --- HARD (10) --- */
    {l:"H",q:"You configure DogStatsD on UDS and start submitting metrics from a container. Tags appear missing. Which is the MOST LIKELY cause?",
      o:["Agent version too old (UDS origin detection requires Agent 6.27+/7+)","Tags must be encoded in JSON","Containers cannot use UDS","Tag dropping is on by default"], c:0,
      e:"Origin detection over UDS requires modern Agents (>=6.27 / 7) and the Agent process to have access to /proc to map socket peer credentials to container IDs.",
      u:"https://docs.datadoghq.com/developers/dogstatsd/unix_socket/"},
    {l:"H",q:"In a strict-egress network, which Datadog intake hostnames typically need outbound TCP 443 (US1)? (Select the BEST description.)",
      o:["api.datadoghq.com only","api., trace.agent., http-intake.logs., process., dbm-metrics-intake., (all at *.datadoghq.com)","Just *.aws.com","Random S3 buckets"], c:1,
      e:"Open egress to each product's intake hostname under datadoghq.com for US1 (and equivalent subdomains for other sites). The exhaustive list is in the Network Traffic doc.",
      u:"https://docs.datadoghq.com/agent/configuration/network/"},
    {l:"H",q:"In Autodiscovery, where do you configure <code>logs:</code> templates for a containerized service?",
      o:["Only in the main datadog.yaml","In pod annotations like <code>ad.datadoghq.com/&lt;container&gt;.logs</code> with a JSON list","DNS","System logs"], c:1,
      e:"Logs configuration is part of AD: annotations like <code>ad.datadoghq.com/nginx.logs: '[{\"source\":\"nginx\",\"service\":\"web\"}]'</code> tell the Agent how to tag/parse logs from that container.",
      u:"https://docs.datadoghq.com/containers/kubernetes/log/"},
    {l:"H",q:"Why is configuring AD via a Kubernetes Service annotation (endpoint check) different from pod annotations?",
      o:["No difference","Endpoint checks let a check run once per endpoint (not per pod) — useful for backends behind a Service","Endpoint checks bypass the Agent","Service annotations only set tags"], c:1,
      e:"Endpoint checks (registered on Services) execute on a Cluster Check Runner, targeting each endpoint behind the Service exactly once — avoiding duplicate work when many pods serve the same backend.",
      u:"https://docs.datadoghq.com/containers/cluster_agent/endpointschecks/"},
    {l:"H",q:"Why is opening UDP outbound from your Agent to Datadog usually unnecessary?",
      o:["UDP is inbound on 8125 (DogStatsD) — outbound to Datadog uses TCP/443","UDP is encrypted","UDP is faster","Agents don't use UDP"], c:0,
      e:"DogStatsD UDP is local on the host (client→Agent on 8125). The Agent then ships data outbound to Datadog over TCP/TLS, not UDP.",
      u:"https://docs.datadoghq.com/agent/configuration/network/"},
    {l:"H",q:"What is the implication of running the Agent in 'host' network mode in Kubernetes?",
      o:["Pod IP equals host IP; DogStatsD UDP can be reached at localhost:8125 by all host-network pods","Datadog Agent ignores annotations","Loss of API access","Causes data duplication"], c:0,
      e:"In host network mode, the Agent's DogStatsD port is reachable at 127.0.0.1:8125 by other host-network pods on the same node — sometimes used to simplify client config.",
      u:"https://docs.datadoghq.com/containers/kubernetes/integrations/"},
    {l:"H",q:"Which configuration provider would you use to pull AD templates from etcd?",
      o:["docker","kubernetes","etcd (with proper TLS and authorization)","file"], c:2,
      e:"Datadog supports the <code>etcd</code> config provider (and consul, zookeeper). You point it at the key-value store containing your templates.",
      u:"https://docs.datadoghq.com/containers/guide/auto_conf/"},
    {l:"H",q:"What is a 'cluster check' vs a 'cluster service check'?",
      o:["Synonyms","Cluster check = check that runs once per cluster (regardless of pods); typically scheduled on cluster check runners","Both are deprecated","Cluster service check is for events"], c:1,
      e:"A cluster check executes once for the cluster (e.g., probing an external API). It's scheduled by the Cluster Agent across one or more Cluster Check Runners.",
      u:"https://docs.datadoghq.com/containers/cluster_agent/clusterchecks/"},
    {l:"H",q:"You see metrics arriving for a containerized integration but logs from the same container are absent. Which is the FIRST thing to check?",
      o:["API key","<code>logs_enabled</code> in datadog.yaml AND the AD <code>logs:</code> annotation/template are both present","DNS","CPU limits"], c:1,
      e:"Logs must be globally enabled (<code>logs_enabled: true</code>) AND the container must be selected by an AD logs template or annotation. Either missing piece breaks log collection.",
      u:"https://docs.datadoghq.com/containers/kubernetes/log/"},
    {l:"H",q:"Why might you configure a Datadog Agent to use HTTP transport for logs instead of TCP?",
      o:["HTTP enables more parallelism and is preferred for high throughput; TCP is for low-volume legacy use","HTTP is unencrypted","TCP doesn't exist","No reason"], c:0,
      e:"HTTP transport (POSTs over TLS to http-intake.logs.&lt;site&gt;) is the recommended high-throughput transport. TCP intake on port 10516 remains for legacy compatibility.",
      u:"https://docs.datadoghq.com/agent/logs/log_transport/"}
  ]},
  {id:"collection", name:"Data Collection", icon:"\u25CB",
   blurb:"DogStatsD, crawlers, integrations, API endpoints, tagging, metrics.",
   questions: [
    /* --- EASY (15) --- */
    {l:"E",q:"Which Datadog metric type captures a single point-in-time value (e.g., free memory)?",
      o:["Gauge","Count","Rate","Distribution"], c:0,
      e:"A GAUGE represents a value at a moment in time. The Agent reports the last value submitted in the flush interval.",
      u:"https://docs.datadoghq.com/metrics/types/"},
    {l:"E",q:"Which metric type represents a counter that increases over time?",
      o:["Gauge","Count","Rate","Set"], c:1,
      e:"COUNT submits the absolute number of occurrences within the flush interval — Datadog stores it as a sum.",
      u:"https://docs.datadoghq.com/metrics/types/"},
    {l:"E",q:"What does the Datadog 'crawler' refer to?",
      o:["A web crawler scraping arbitrary websites","An integration where Datadog pulls data from a cloud provider's API on your behalf","A type of monitor","A backup tool"], c:1,
      e:"Cloud crawlers (AWS, Azure, GCP, etc.) authenticate to the provider's API and pull metrics/events directly — no Agent required for some integrations.",
      u:"https://docs.datadoghq.com/integrations/"},
    {l:"E",q:"True or false: integrating with AWS via Datadog's cloud integration requires installing the Agent on every EC2 instance.",
      o:["True","False"], c:1,
      e:"False. The AWS crawler integration uses an IAM role and pulls CloudWatch metrics for the account. You can still install the Agent on EC2 hosts for richer per-host data.",
      u:"https://docs.datadoghq.com/integrations/amazon_web_services/"},
    {l:"E",q:"In a DogStatsD client, the line <code>page.views:1|c</code> submits which type of metric?",
      o:["Gauge","Count","Distribution","Histogram"], c:1,
      e:"<code>|c</code> denotes a counter. <code>|g</code> = gauge, <code>|h</code> = histogram, <code>|d</code> = distribution, <code>|s</code> = set.",
      u:"https://docs.datadoghq.com/developers/dogstatsd/datagram_shell/"},
    {l:"E",q:"What is the recommended key:value format for Datadog tags?",
      o:["KEY=VALUE","KEY:VALUE","KEY|VALUE","KEY/VALUE"], c:1,
      e:"Datadog tags use <code>key:value</code> (e.g., <code>env:prod</code>, <code>service:web</code>). Single-value tags are also allowed.",
      u:"https://docs.datadoghq.com/getting_started/tagging/"},
    {l:"E",q:"What is the maximum number of characters in a Datadog tag?",
      o:["50","100","200","500"], c:2,
      e:"A tag can be up to 200 characters. Key, colon, and value all count toward that limit.",
      u:"https://docs.datadoghq.com/getting_started/tagging/"},
    {l:"E",q:"Which three tags form Unified Service Tagging?",
      o:["env, service, version","host, datacenter, region","team, owner, cost_center","container, image, namespace"], c:0,
      e:"Unified Service Tagging uses <code>env</code>, <code>service</code>, and <code>version</code> across metrics, traces, and logs for correlated observability.",
      u:"https://docs.datadoghq.com/getting_started/tagging/unified_service_tagging/"},
    {l:"E",q:"Which Datadog product surfaces Datadog's catalog of 600+ integrations for one-click install?",
      o:["Watchdog","Integrations page","Service Catalog","Notebooks"], c:1,
      e:"The Integrations page in the Datadog UI lists available integrations (Agent-based and crawlers) and walks you through setup.",
      u:"https://docs.datadoghq.com/integrations/"},
    {l:"E",q:"Which Datadog API endpoint is used to submit custom metrics via HTTP?",
      o:["/api/v1/series","/api/v1/logs","/api/v1/events","/api/v1/check_run"], c:0,
      e:"<code>POST /api/v1/series</code> submits metric series. Use DogStatsD for higher throughput.",
      u:"https://docs.datadoghq.com/api/latest/metrics/"},
    {l:"E",q:"Which file format does the Datadog Agent expect for integration configurations?",
      o:["JSON","YAML","XML","TOML"], c:1,
      e:"All integration configs are YAML — placed under <code>conf.d/&lt;integration&gt;.d/conf.yaml</code> with an <code>instances:</code> list.",
      u:"https://docs.datadoghq.com/getting_started/integrations/"},
    {l:"E",q:"What does a 'tag' do in Datadog?",
      o:["Encrypts data","Provides searchable metadata to filter, group, and correlate telemetry","Replaces hostnames","Is required for the Agent to start"], c:1,
      e:"Tags are key:value (or value) metadata attached to telemetry. They power filtering, grouping, and cross-product correlation.",
      u:"https://docs.datadoghq.com/getting_started/tagging/"},
    {l:"E",q:"True or false: Datadog tags are case-sensitive.",
      o:["True","False"], c:1,
      e:"False. Metric tag keys are normalized to lowercase. Use lowercase keys to avoid drift (don't rely on case-sensitive matching).",
      u:"https://docs.datadoghq.com/getting_started/tagging/"},
    {l:"E",q:"Which integration mechanism is BEST for collecting metrics from a third-party application running on your host (e.g., PostgreSQL)?",
      o:["Agent-based integration with PostgreSQL credentials in conf.yaml","Crawler","Custom DogStatsD","Hand-written cron job"], c:0,
      e:"Datadog ships an Agent-based PostgreSQL integration. Provide credentials in <code>postgres.d/conf.yaml</code> and restart the Agent.",
      u:"https://docs.datadoghq.com/integrations/postgres/"},
